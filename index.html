function num(v){
  if(typeof v==='number')return isFinite(v)?v:0;
  if(v==null)return 0;let s=String(v).trim();if(!s)return 0;let neg=false;
  if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1)}
  s=s.replace(/[^\d,.\-]/g,'');
  if(s.endsWith('-')){neg=!neg;s=s.slice(0,-1)}
  if(s.startsWith('-')){neg=!neg;s=s.slice(1)}
  const hc=s.includes(','),hd=s.includes('.');
  if(hc&&hd){if(s.lastIndexOf(',')>s.lastIndexOf('.'))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'')}
  else if(hc){const p=s.split(',');s=p.length>2?s.replace(/,/g,''):s.replace(',','.')}
  else if(hd){const p=s.split('.');if(p.length>2||(p.length===2&&p[1].length===3))s=s.replace(/\./g,'')}
  const n=parseFloat(s);return isNaN(n)?0:(neg?-n:n);
}

/* Tüm şirketlerde ortak modüller; yönetici şirkete özel ek modül açabilir */
const CORE_MODS=['TMS19','REESKONT','KREDI','TMS16','IFRS16','HEDGE','TMS29','TMS12','SINIF'];
function coMods(c){return [...new Set([...CORE_MODS,...((c&&c.modules)||[])])]}
function modInfo(code){return cfg().modules.find(m=>m.code===code)||{code,short:code,name:code}}
function curCo(){return S.companies.find(c=>c.id===S.company)||null}
function periods(){const set=new Set([S.period,...S.extraPeriods]);Object.values(S.tbIndex).forEach(m=>m.period&&set.add(m.period));return [...set].filter(Boolean).sort().reverse()}

/* ---------- Hesaplama ---------- */
function ensureTB(key){
  const meta=S.tbIndex[key];if(!meta||!S.db)return;
  const c=S.tbCache[key];if(c&&c.stamp===meta.uploadedAt)return;
  if(S.tbLoading[key]===meta.uploadedAt)return;
  S.tbLoading[key]=meta.uploadedAt;
  (async()=>{
    try{
      const n=meta.parts||1;
      const snaps=await Promise.all(Array.from({length:n},(_,i)=>S.db.doc('tbpart/'+key+'__p'+i).get()));
      const rows=[];
      snaps.forEach(s=>{if(!s.exists)return;const t=String(s.data().text||'');t.split('\n').forEach(line=>{if(!line)return;const p=line.split('\t');rows.push([p[0],p[1]||'',+p[2]||0,+p[3]||0,p[4]||'',p[5]||''])})});
      S.tbCache[key]={stamp:meta.uploadedAt,rows};
    }catch(e){S.tbCache[key]={stamp:meta.uploadedAt,rows:[],err:true}}
    finally{delete S.tbLoading[key];render()}
  })();
}
/* IFRS kod kontrolü: BSA = bilanço aktif, BSL = bilanço pasif (yükümlülük + özkaynak), PL = gelir tablosu */
const IFRS_SECS={BSA:['A'],BSL:['L','E'],PL:['IS']};
const IFRS_LABEL={BSA:'Bilanço · aktif',BSL:'Bilanço · pasif',PL:'Gelir tablosu'};
const IFRS_DEF_GRP={BSA:'donen',BSL:'kv',PL:'faaliyet'};
function ifrsCode(v){return String(v??'').toLocaleUpperCase('tr').replace(/İ/g,'I').replace(/\s+/g,'')}
function ifrsCat(code){const m=/^(BSA|BSL|PL)/.exec(String(code||''));return m?m[1]:null}
function expIfrs(l){const s=secOf(l);return s==='A'?'BSA':s==='IS'?'PL':'BSL'}
function ifrsCheck(code,lineId){
  if(!code)return {st:'none'};const cat=ifrsCat(code);if(!cat)return {st:'unk'};
  const l=lineId&&lineById(lineId);if(!l)return {st:'nomap',cat};
  return IFRS_SECS[cat].includes(secOf(l))?{st:'ok',cat}:{st:'bad',cat,exp:expIfrs(l)};
}
function ifrsCell(a){
  const k=a.ifrs;const x=a.chk||{};const nm=a.ifrsName?' · '+a.ifrsName:'';
  if(x.st==='none')return '<span class="pill warn">Kod yok</span>';
  if(x.st==='unk')return `<span class="pill warn" title="Kod BSA, BSL veya PL ile başlamıyor${esc(nm)}">${esc(k)} ?</span>`;
  if(x.st==='nomap')return `<span class="pill neutral" title="${esc(IFRS_LABEL[x.cat]+nm)} · VUK kuralıyla eşlenmediği için sınıf kontrolü yapılamadı">${esc(k)}</span>`;
  if(x.st==='ok')return `<span class="pill ok" title="${esc(IFRS_LABEL[x.cat]+nm)} · VUK kural kalemiyle uyumlu">${esc(k)} ✓</span>`;
  return `<span class="pill bad" title="Kod ${esc(IFRS_LABEL[x.cat])}, VUK kural kalemi ise ${esc(IFRS_LABEL[x.exp])}${esc(nm)}">${esc(k)} ≠ ${esc(x.exp)}</span>`;
}
/* IFRS kodları WTB satırı olarak: ad mizandan, alt grup (dönen/duran, KV/UV/özkaynak, brüt/faaliyet/finansman/vergi) kodun hesaplarının VUK kural kalemlerinden türetilir */
function codeLineOf(e){
  const mp=mapOf(e.id);
  if(mp){const ttl=e.name||mp.dip||mp.en;return {id:e.id,name:e.id+(ttl?' · '+ttl:''),title:ttl,grp:mapSec(e.id),cat:e.cat||ifrsCat(e.id),stmt:mp.line,dip:mp.dip,hasilat:norm(mp.line)==='hasilat',code:true,mapped:true}}
  let best=null,bv=-1;Object.entries(e.votes).forEach(([k,v])=>{if(v>bv){bv=v;best=k}});
  const bl=best&&lineById(best);
  const okGrp=bl&&(!e.cat||IFRS_SECS[e.cat].includes(GROUPS[bl.grp].sec));
  const grp=okGrp?bl.grp:(IFRS_DEF_GRP[e.cat]||'faaliyet');
  return {id:e.id,name:e.id+(e.name?' · '+e.name:''),title:e.name,grp:mapSec(e.id)||grp,cat:e.cat,stmt:null,hasilat:okGrp&&best==='hasilat',code:true,mapped:false};
}
function anyLine(id){const l=lineById(id);if(l)return l;const c=S.codeCat[id];if(c)return c;if(mapOf(id))return codeLineOf({id,name:'',cat:ifrsCat(id),votes:{}});const cat=ifrsCat(id);return cat?{id,name:id,grp:IFRS_DEF_GRP[cat],cat,code:true}:null}
function lineName(id){const l=anyLine(id);return l?l.name:id}
function pendLabel(acc){const n=acc.pending.length;return acc.codeMode?n+' hesapta IFRS kodu yok':n+' hesap eşlenmedi'}
function matchLine(code){const d=String(code).replace(/\D/g,'');for(const r of rules()){if(d.startsWith(r.d))return {line:r.line,rule:r.d}}return null}
function computeAccounts(cid,period){
  const key=tbKey(cid,period);const c=S.tbCache[key];const meta=S.tbIndex[key];
  if(!meta||!c||c.stamp!==meta.uploadedAt)return null;
  const ov=(S.maps[cid]&&S.maps[cid].codes)||{};
  const accs=[],byLine={},unmapped=[],ifrsBad=[],byCode={},uncoded=[],catBal={BSA:0,BSL:0,PL:0};let unBal=0,tD=0,tC=0,ifrsCnt=0,ifrsUnk=0,uncodedBal=0,codeTot=0;
  for(const r of c.rows){
    const [code,name,d,cr,ifrs,ifrsName]=r;const bal=d-cr;tD+=d;tC+=cr;
    const ok=code.replace(/\./g,'_');let line=null,src=null,rule=null;
    if(ov[ok]&&lineById(ov[ok])){line=ov[ok];src='ov'}
    else{const m=matchLine(code);if(m&&lineById(m.line)){line=m.line;src='rule';rule=m.rule}}
    const a={code,name,d,c:cr,bal,line,src,rule,ifrs:ifrs||'',ifrsName:ifrsName||''};a.chk=ifrsCheck(a.ifrs,line);accs.push(a);
    if(a.ifrs)ifrsCnt++;if(a.chk.st==='bad')ifrsBad.push(a);if(a.chk.st==='unk')ifrsUnk++;
    if(line)byLine[line]=(byLine[line]||0)+bal;else{unmapped.push(a);unBal+=bal}
    if(a.ifrs){const e=byCode[a.ifrs]||(byCode[a.ifrs]={id:a.ifrs,name:'',cat:ifrsCat(a.ifrs),vuk:0,n:0,votes:{}});e.vuk+=bal;e.n++;if(!e.name&&a.ifrsName)e.name=a.ifrsName;if(line)e.votes[line]=(e.votes[line]||0)+Math.abs(bal)+1e-6;if(e.cat)catBal[e.cat]+=bal;codeTot+=bal}
    else{uncoded.push(a);uncodedBal+=bal}
  }
  const codeMode=ifrsCnt>0;
  const codeLines=Object.values(byCode).sort((x,y)=>x.id.localeCompare(y.id,'en',{numeric:true})).map(codeLineOf);
  codeLines.forEach(l=>{S.codeCat[l.id]=l});
  /* Kodsuz hesapların toplamı sıfırsa (7/A yansıtma hesapları: 63x/66x ↔ 761/771/781) kabul edilir */
  const uncZero=uncoded.length>0&&Math.abs(uncodedBal)<0.5;
  const codeOk=codeMode&&(!uncoded.length||uncZero)&&!ifrsUnk&&Math.abs(codeTot)<0.5;
  const pending=codeMode?(uncZero?[]:uncoded):unmapped;const nomap=codeMode?codeLines.filter(l=>!l.mapped):[];
  return {nomap,accs,byLine,unmapped,unBal,tD,tC,ifrsBad,ifrsCnt,ifrsUnk,codeMode,byCode,codeLines,uncoded,uncodedBal,catBal,codeTot,codeOk,pending};
}
function adjFor(cid,period,drafts){return S.adj.filter(a=>a.companyId===cid&&a.period===period&&(drafts||a.status==='approved')).concat(aclEntries(cid,period).filter(a=>drafts||a.status==='approved')).sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt)))}
function impact(e){let s=0;(e.lines||[]).forEach(l=>{const ln=anyLine(l.line);if(ln&&secOf(ln)==='IS'&&ln.grp!=='dkg')s+=(+l.cr||0)-(+l.dr||0)});return s}
function computeWTB(cid,period,drafts){
  const acc=computeAccounts(cid,period);if(!acc)return null;
  const ents=adjFor(cid,period,drafts);
  const order=cfg().modules.map(m=>m.code);
  const srt=(a,b)=>{const ia=order.indexOf(a),ib=order.indexOf(b);return (ia<0?999:ia)-(ib<0?999:ib)};
  const mods=[...new Set(ents.filter(e=>adjLayer(e)==='ufrs').map(e=>e.module))].sort(srt);
  const mods29=[...new Set(ents.filter(e=>adjLayer(e)==='ias29').map(e=>e.module))].sort(srt).map(m=>'i:'+m);
  const vals={};const codeMode=acc.codeMode;const lines=codeMode?acc.codeLines.slice():cfg().lines;
  lines.forEach(l=>{vals[l.id]={vuk:codeMode?(acc.byCode[l.id]?acc.byCode[l.id].vuk:0):(acc.byLine[l.id]||0),m:{},ufrs:0,ias29:0}});
  ents.forEach(e=>(e.lines||[]).forEach(l=>{let v=vals[l.line];
    if(!v&&codeMode){const nl=anyLine(l.line);if(nl&&nl.code){lines.push(nl);v=vals[nl.id]={vuk:0,m:{},ufrs:0,ias29:0}}}
    if(!v)return;const mk=(adjLayer(e)==='ias29'?'i:':'')+e.module;v.m[mk]=(v.m[mk]||0)+(+l.dr||0)-(+l.cr||0)}));
  if(codeMode)lines.sort((x,y)=>x.id.localeCompare(y.id,'en',{numeric:true}));
  Object.values(vals).forEach(v=>{let u=0,i=0;Object.entries(v.m).forEach(([k,x])=>{if(k.startsWith('i:'))i+=x;else u+=x});v.ufrs=v.vuk+u;v.ias29=v.ufrs+i});
  const cols=['vuk',...mods,'ufrs',...mods29,'ias29'];
  return {acc,ents,mods,mods29,vals,lines,codeMode,cols,ui:cols.indexOf('ufrs'),ii:cols.indexOf('ias29')};
}
function colVal(w,l,col){const v=w.vals[l.id];if(!v)return 0;const raw=col==='vuk'?v.vuk:col==='ufrs'?v.ufrs:col==='ias29'?v.ias29:(v.m[col]||0);return sign(l)*raw}
function adjLayer(e){return e.layer||(e.module==='TMS29'?'ias29':'ufrs')}
function colTitle(x){return x==='vuk'?'VUK':x==='ufrs'?'UFRS':x==='ias29'?'IAS 29':x.startsWith('i:')?modInfo(x.slice(2)).short+' (IAS 29)':modInfo(x).short}
function profitCols(w){const ls=w.lines.filter(l=>secOf(l)==='IS');return w.cols.map(c=>ls.reduce((s,l)=>s+colVal(w,l,c),0))}
function buildBS(w){
  const lines=w.lines,cols=w.cols,rows=[];
  const nz=l=>cols.some(c=>Math.abs(colVal(w,l,c))>0.005);
  const add=(a,b)=>a.map((x,i)=>x+b[i]);
  const grp=(g,extra)=>{
    const ls=lines.filter(l=>l.grp===g);const its=stmtItems(w,ls);const iv=(it,c)=>it.ls.reduce((x,l)=>x+colVal(w,l,c),0);
    const vis=S.hideZero?its.filter(it=>cols.some(c=>Math.abs(iv(it,c))>0.005)):its;
    rows.push({t:'sec',label:GROUPS[g].opt});
    vis.forEach(it=>rows.push({t:'line',label:it.label,vals:cols.map(c=>iv(it,c)),ids:it.ls.map(l=>l.id)}));
    let s=cols.map(c=>ls.reduce((x,l)=>x+colVal(w,l,c),0));let gi=ls.map(l=>l.id);
    if(extra){rows.push({t:'line',label:extra.label,vals:extra.vals,em:true,ids:extra.ids});s=add(s,extra.vals);gi=gi.concat(extra.ids||[])}
    if(!vis.length&&!extra)rows.push({t:'none',label:'Bu grupta tutar yok'});
    rows.push({t:'sub',label:GROUPS[g].sub,vals:s,ids:gi});return s;
  };
  const idsOf=f=>lines.filter(f).map(l=>l.id);
  const ta=add(grp('donen'),grp('duran'));rows.push({t:'tot',label:'Toplam varlıklar',vals:ta,ids:idsOf(l=>secOf(l)==='A')});
  const p=profitCols(w);
  const tk=add(add(grp('kv'),grp('uv')),grp('oz',{label:lines.some(l=>l.grp==='dkg')?'Toplam kapsamlı gelir (gelir tablosundan)':'Dönem kârı (gelir tablosundan)',vals:p,ids:idsOf(l=>secOf(l)==='IS')}));
  rows.push({t:'tot',label:'Toplam kaynaklar',vals:tk,ids:idsOf(l=>secOf(l)!=='A')});
  return {rows,diff:ta.map((x,i)=>x-tk[i]),ta,tk};
}
function buildIS(w){
  const lines=w.lines,cols=w.cols,rows=[];
  const nz=l=>cols.some(c=>Math.abs(colVal(w,l,c))>0.005);
  let run=cols.map(()=>0);const subs={};let rid=[];
  const gs=['brut','faaliyet','yatirim','finans','vergi','dkg'].filter(g=>g!=='yatirim'&&g!=='dkg'||lines.some(l=>l.grp===g));
  gs.forEach(g=>{
    const ls=lines.filter(l=>l.grp===g);const its=stmtItems(w,ls);const iv=(it,c)=>it.ls.reduce((x,l)=>x+colVal(w,l,c),0);
    const vis=S.hideZero?its.filter(it=>cols.some(c=>Math.abs(iv(it,c))>0.005)):its;
    vis.forEach(it=>rows.push({t:'line',label:it.label,vals:cols.map(c=>iv(it,c)),ids:it.ls.map(l=>l.id)}));
    run=run.map((x,i)=>x+ls.reduce((s,l)=>s+colVal(w,l,cols[i]),0));rid=rid.concat(ls.map(l=>l.id));
    subs[g]=run.slice();rows.push({t:g==='vergi'||g==='dkg'?'tot':'sub',label:GROUPS[g].sub,vals:run.slice(),ids:rid.slice()});
  });
  if(w.codeMode){const hs=lines.filter(l=>l.hasilat);subs.hasilat=cols.map(c=>hs.reduce((s,l)=>s+colVal(w,l,c),0))}
  else{const has=lineById('hasilat');subs.hasilat=has?cols.map(c=>colVal(w,has,c)):cols.map(()=>0)}
  return {rows,subs};
}

function lineOptions(sel,auto){
  let h=`<option value="">${auto?'Kurala göre (otomatik)':'Kalem seçin'}</option>`;
  GROUP_ORDER.forEach(g=>{const ls=cfg().lines.filter(l=>l.grp===g);if(!ls.length)return;h+=`<optgroup label="${esc(GROUPS[g].opt)}">`+ls.map(l=>`<option value="${esc(l.id)}"${l.id===sel?' selected':''}>${esc(l.name)}</option>`).join('')+'</optgroup>'});

}
function stepState(c){
  const st={};if(!c)return st;const key=tbKey(c.id,S.period);const meta=S.tbIndex[key];
  const acc=meta?computeAccounts(c.id,S.period):null;
  const bal=meta&&Math.abs(meta.totalD-meta.totalC)<0.5;
  st.mizan=!!(acc&&bal&&!acc.pending.length&&!acc.ifrsBad.length&&(!acc.codeMode||(acc.codeOk&&!acc.nomap.length)));
  if(acc&&acc.codeMode){const R=reconState(c);st.recon=!!(R&&R.valid&&R.critOk)}else st.recon=st.mizan;
  const ents=adjFor(c.id,S.period,true);st.duzeltmeler=ents.length>0&&ents.every(e=>e.status==='approved');
  if(st.mizan){const w=computeWTB(c.id,S.period,S.drafts);if(w){const bs=buildBS(w);st.wtb=Math.abs(bs.diff[w.ui])<0.5&&Math.abs(bs.diff[w.ii])<0.5}}
  return st;
}
function steps(cur){
  const st=stepState(curCo());

}

function vMizan(){
  const c=curCo();if(!c)return head('Mizan','')+noCo();
  const key=tbKey(c.id,S.period),meta=S.tbIndex[key];
  let h=head('Mizan',`${esc(c.name)} · ${periodLabel(S.period)}${demoPill(c)}`)+steps('mizan');

function buildParsed(p){
  const aoa=p.sheets[p.sheet]||[];const {code,name,d,c,b,k:kc,kn}=p.cols;const isB=p.mode==='bakiye';const sg=p.bsign==='cpos'?-1:1;const map=new Map();let read=0;
  for(let r=p.headerRow+1;r<aoa.length;r++){
    const row=aoa[r]||[];let k=String(row[code]??'').trim();if(!k)continue;
    k=k.replace(/\s+/g,'').replace(/[-_/,]/g,'.').replace(/\.+$/,'');
    if(!/^\d[\d.]*$/.test(k))continue;read++;
    const it=map.get(k)||{code:k,name:String(row[name]??'').replace(/[\t\r\n]+/g,' ').trim(),d:0,c:0,bal:0,ifrs:'',ifrsName:''};
    if(isB)it.bal+=sg*num(row[b]);else{it.d+=num(row[d]);it.c+=num(row[c])}
    if(kc>=0&&!it.ifrs)it.ifrs=ifrsCode(row[kc]);
    if(kn>=0&&!it.ifrsName)it.ifrsName=String(row[kn]??'').replace(/[\t\r\n]+/g,' ').trim();
    map.set(k,it);
  }
  if(isB)map.forEach(it=>{it.d=it.bal>0?it.bal:0;it.c=it.bal<0?-it.bal:0});
  const all=[...map.values()].sort((a,b)=>a.code.localeCompare(b.code,'en',{numeric:true}));
  const dg=x=>x.replace(/\D/g,'');
  let level=p.level;if(level==='auto'&&kc>=0)level='leaf';if(level==='auto')level=all.some(a=>!a.code.includes('.')&&dg(a.code).length===3)?'main':'leaf';
  let rows;
  if(level==='main')rows=all.filter(a=>!a.code.includes('.')&&dg(a.code).length===3);
  else if(level==='leaf'){
    const sorted=all.slice().sort((a,b)=>a.code<b.code?-1:a.code>b.code?1:0);
    const parent=new Set();
    for(let i=0;i<sorted.length-1;i++){const a=sorted[i].code,b=sorted[i+1].code;if(b.startsWith(a+'.')||(!a.includes('.')&&!b.includes('.')&&b.length>a.length&&b.startsWith(a)))parent.add(a)}
    rows=all.filter(a=>!parent.has(a.code));

  return {rows,level,read,tD,tC,ifrsCnt,ifrsUnk};
}

/* WTB görünümü: VUK → UFRS düzeltmeleri → UFRS → TMS 29 düzeltmeleri → TMS 29. Düzeltme hücresine tıklanınca modül ve kayıt bazında döküm açılır. */
function wtbAgg(w,v){let u=0,i=0;for(let k=1;k<w.ui;k++)u+=v[k];for(let k=w.ui+1;k<w.ii;k++)i+=v[k];return [v[0],u,v[w.ui],i,v[w.ii]]}
function wtbBreak(w,r,layer){
  const mods=layer==='u'?w.mods.map((m,k)=>({m,col:m,v:r.vals[1+k]})):w.mods29.map((m,k)=>({m:m.slice(2),col:m,v:r.vals[w.ui+1+k]}));
  const ids=r.ids?new Set(r.ids):null;
  return mods.filter(x=>Math.abs(x.v)>0.005).map(x=>{
    let ents=[];
    if(ids)ents=w.ents.filter(e=>e.module===x.m&&(adjLayer(e)==='ias29')===(layer==='i')).map(e=>{let v=0;(e.lines||[]).forEach(l=>{if(!ids.has(l.line))return;const ln=anyLine(l.line);if(!ln)return;v+=sign(ln)*((+l.dr||0)-(+l.cr||0))});return {e,v}}).filter(y=>Math.abs(y.v)>0.005);
    return {m:x.m,v:x.v,ents};
  });
}
function wtbTable(rows,w,hdrLbl,tab){
  const hd=`<th class="num">VUK</th><th class="num adjc">UFRS düzeltmeleri</th><th class="num ufc">UFRS</th><th class="num adjc">TMS 29 düzeltmeleri</th><th class="num iac">TMS 29 (final)</th>`;
  const CN=6;const cls=['','adjc','ufc','adjc','iac'];
  return `<div class="tw"><table><thead><tr><th style="min-width:240px">${hdrLbl||(w.codeMode?'Mali tablo kalemi':'UFRS kalemi')}</th>${hd}</tr></thead><tbody>${rows.map((r,ri)=>{
    if(r.t==='sec')return `<tr class="sec"><td colspan="${CN}">${esc(r.label)}</td></tr>`;
    if(r.t==='none')return `<tr class="none"><td colspan="${CN}">${esc(r.label)}</td></tr>`;
    const a=wtbAgg(w,r.vals);const key=(tab||'')+':'+ri+':'+r.label;
    const td=a.map((v,k)=>{const lay=k===1?'u':k===3?'i':null;
      if(lay&&Math.abs(v)>0.005){const open=S.wtbBd===key+'|'+lay;return `<td class="num ${cls[k]}"><button class="adjbtn${open?' on':''}" data-act="adjbd" data-k="${esc(key+'|'+lay)}" aria-expanded="${open}" title="Dökümü göster">${fa(v)}</button></td>`}
      return `<td class="num${cls[k]?' '+cls[k]:''}">${fa(v)}</td>`}).join('');
    let h=`<tr class="${r.t==='line'?'':r.t}"><td${r.em?' style="font-style:italic"':''}>${esc(r.label)}</td>${td}</tr>`;
    ['u','i'].forEach(lay=>{if(S.wtbBd!==key+'|'+lay)return;const bd=wtbBreak(w,r,lay);
      h+=`<tr class="bdrow"><td colspan="${CN}"><div class="bd"><div class="row sp"><strong>${esc(r.label)} · ${lay==='u'?'UFRS düzeltmeleri':'TMS 29 düzeltmeleri'} dökümü</strong><button class="btn sm ghost" data-act="adjbd" data-k="${esc(key+'|'+lay)}">Kapat</button></div>
      ${bd.map(x=>`<div class="bdm"><div class="row sp"><span><span class="chip">${esc(modInfo(x.m).short)}</span> ${esc(modInfo(x.m).name)}</span><span class="num" style="font-weight:600">${fa(x.v)}</span></div>${x.ents.map(y=>`<div class="row sp small bde"><span>${esc(y.e.desc||'Açıklamasız kayıt')}${y.e.status!=='approved'?' <span class="pill warn">Taslak</span>':''}</span><span class="num">${fa(y.v)}</span></div>`).join('')}</div>`).join('')||'<span class="small muted">Döküm bulunamadı.</span>'}
      <div class="row sp" style="border-top:1px solid var(--line);padding-top:6px;font-weight:600"><span>Toplam</span><span class="num">${fa(a[lay==='u'?1:3])}</span></div></div></td></tr>`});
    return h;
  }).join('')}</tbody></table></div>`;
}

/* ---------- Dönem kilidi ve iz kaydı ----------
   Kilitli şirket-dönemde düzeltme kayıtları (adj) ve mizan (tb/tbpart) yazılamaz/silinemez. Kilit config/locks belgesinde.
   Düzeltme, mizan ve kilit değişiklikleri audit koleksiyonuna yazılır (kim: kullanıcı kimliği, ne zaman, ne). */
function lockKey(cid,p){return cid+'__'+p}
function isLocked(cid,p){return !!(S.locks&&S.locks[lockKey(cid,p)])}
function lockInfoOf(path,d){
  const id=String(path).split('/').pop();
  if(path.startsWith('adj/')){const prev=S.adj.find(a=>a.id===id);const x=d||prev;return x?{cid:x.companyId,p:x.period,prev}:null}
  if(path.startsWith('tb/')||path.startsWith('tbpart/')){const k=id.replace(/__p\d+$/,'');const i=k.lastIndexOf('__');return i>0?{cid:k.slice(0,i),p:k.slice(i+2)}:null}
  return null;
}
function lockCheck(path,d){const li=lockInfoOf(path,d);if(li&&isLocked(li.cid,li.p))throw Object.assign(new Error('locked'),{code:'locked'});
  if(li&&li.prev&&d&&(li.prev.companyId!==d.companyId||li.prev.period!==d.period)&&isLocked(li.prev.companyId,li.prev.period))throw Object.assign(new Error('locked'),{code:'locked'});return li}
function auditLog(act,path,d,li){

/* ---------- IAS 29 · parasal kayıp/kazanç bağımsız sağlaması ----------
   Net parasal pozisyon (parasal varlıklar − parasal yükümlülükler, UFRS) yüklü mizan tarihlerinde bulunur; iki tarih arasında
   ortalama pozisyon × (I_rapor / I_baş − I_rapor / I_son) parasal kayıp (rapor ayı satın alma gücüyle). Robotların PL4300 toplamıyla karşılaştırılır. */
const I29_NONMON=/^(BSA14|BSA150[0-7]|BSA1801|BSA2[2-8]|BSA31|BSL117[23]|BSL123[0-2]|BSL2)/;
function i29IsMon(code){return /^(BSA|BSL1)/.test(code)&&!I29_NONMON.test(code)&&!TAX_DT.test(code)}
function i29MonCheck(c,w,B){
  if(!w||!w.codeMode||!B.Ir)return '';const Y=B.Y;const pts=[];const decP=(Y-1)+'-12';
  const sumMon=vals=>{let n=0;Object.entries(vals).forEach(([k,v])=>{if(i29IsMon(k))n+=v});return n};
  if(S.tbIndex[tbKey(c.id,decP)]){ensureTB(tbKey(c.id,decP));const a0=computeAccounts(c.id,decP);if(a0){const by={};a0.accs.forEach(a=>{if(a.ifrs)by[a.ifrs]=(by[a.ifrs]||0)+a.bal});
    const ac=aclRecY(c.id,String(Y-1));if(ac)Object.values(aclGroups(ac)).forEach(g=>{if(g.y==='ufrs')Object.entries(g.by).forEach(([k,v])=>{by[k]=(by[k]||0)+v})});pts.push({p:decP,n:sumMon(by),src:'Aralık mizanı + UFRS açılış'})}}
  fsCoPeriods(c.id).filter(p=>p.slice(0,4)===String(Y)&&p<S.period).sort().forEach(p=>{const r=fsW(c.id,p);if(r.st==='ok'){const v={};Object.entries(r.w.vals).forEach(([k,x])=>v[k]=x.ufrs);pts.push({p,n:sumMon(v),src:'Mizan + UFRS düzeltmeleri'})}});
  {const v={};Object.entries(w.vals).forEach(([k,x])=>v[k]=x.ufrs);pts.push({p:S.period,n:sumMon(v),src:'Cari WTB (UFRS)'})}
  pts.sort((a,b)=>a.p.localeCompare(b.p));const segs=[];let miss=[];
  const I=p=>endeks(p);const Ir=B.Ir;
  if(pts[0].p!==decP)segs.push({a:decP,b:pts[0].p,x:pts[0].n,note:'Aralık mizanı yok; ilk noktadaki pozisyon sabit varsayıldı'});
  for(let i=1;i<pts.length;i++)segs.push({a:pts[i-1].p,b:pts[i].p,x:(pts[i-1].n+pts[i].n)/2});
  let loss=0;segs.forEach(s=>{const ia=I(s.a),ib=I(s.b);if(!ia||!ib){miss.push(!ia?s.a:s.b);s.l=null;return}s.l=s.x*(Ir/ia-Ir/ib);loss+=s.l});
  const est=r2(-loss);const pv=w.vals[I29_NPMP];const rob=pv?r2(-(pv.ias29-pv.ufrs)):0;const diff=r2(rob-est);const base=Math.max(Math.abs(rob),Math.abs(est),1);const pct=Math.abs(diff)/base;
  const st=miss.length?'neutral':pct<=0.10?'ok':pct<=0.25?'warn':'bad';
  const g=v=>`<span style="color:${v<0?'var(--bad)':'inherit'}">${fTL(r2(v))}</span>`;
  return `<section class="card"><div class="ch"><div><h2>Parasal kayıp/kazanç · bağımsız sağlama</h2><p>Robotların ${I29_NPMP} toplamı, net parasal pozisyon yöntemiyle yapılan bağımsız tahminle karşılaştırılır. Parasal olmayan kalemler (stok, peşin gider/avans, MDV, MOV, KHV, alınan avans/ertelenmiş gelir, özkaynak) ve ertelenmiş vergi hariç tutulur. Makullük testidir; mizan yüklenen ay sayısı arttıkça isabet artar.</p></div><span class="pill ${st}">${miss.length?'Endeks eksik':pct<=0.10?'Makul (≤%10)':pct<=0.25?'Kontrol edin (≤%25)':'Fark büyük'}</span></div>
  <div class="tw"><table><thead><tr><th>Tarih</th><th>Kaynak</th><th class="num">Net parasal pozisyon (varlık + / yük. −)</th></tr></thead><tbody>
  ${pts.map(x=>`<tr><td>${esc(periodLabel(x.p))}</td><td class="small">${esc(x.src)}</td><td class="num">${fTL(r2(x.n))}</td></tr>`).join('')}</tbody></table></div>
  <div class="tw"><table><thead><tr><th>Aralık</th><th class="num">Ortalama pozisyon</th><th class="num">Katsayı farkı</th><th class="num">Kazanç / (kayıp)</th></tr></thead><tbody>
  ${segs.map(s=>`<tr><td>${esc(ymLabel(s.a))} → ${esc(ymLabel(s.b))}${s.note?`<br><span class="small muted">${esc(s.note)}</span>`:''}</td><td class="num">${fTL(r2(s.x))}</td><td class="num">${I(s.a)&&I(s.b)?NF6.format(Ir/I(s.a)-Ir/I(s.b)):'–'}</td><td class="num">${s.l==null?'–':g(-s.l)}</td></tr>`).join('')}
  <tr class="tot"><td colspan="3">Bağımsız tahmin</td><td class="num">${g(est)}</td></tr>
  <tr><td colspan="3">Robotların ${I29_NPMP} toplamı (WTB IAS 29 katmanı)</td><td class="num">${g(rob)}</td></tr>
  <tr class="tot"><td colspan="3">Fark (%${NF1.format(pct*100)})</td><td class="num">${g(diff)}</td></tr></tbody></table></div>
  ${miss.length?`<div class="cb"><span class="small">Endeksi eksik ay: ${esc([...new Set(miss)].map(ymLabel).join(', '))}</span></div>`:''}
  <div class="cb"><span class="small muted">Fark büyükse: eksik robot kaydı (kıdem, reeskont, kredi, hedge), parasal/parasal olmayan sınıflaması farklı kalemler ya da yıl içinde dalgalı parasal pozisyon (ara ay mizanlarını yükleyin) nedeni olabilir.</span></div></section>`;
}

/* ---------- Özkaynak değişim tablosu (IAS 29, rapor ayı satın alma gücüyle) ---------- */
function fsEquityCard(c,st){
  const w=st.cur.w;ensureI29(c.id);const d=S.i29[c.id];if(d==null)return '';
  let X;try{X=i29Calc(c,w,d)}catch(e){return ''}const O=X.oz;const B=X.B;
  const is=buildIS(w).subs;const np=is.vergi?is.vergi[w.ii]:0;const tci=is.dkg?is.dkg[w.ii]:np;const oci=tci-np;
  const grpOf=code=>{const m=mapOf(code);return (m&&m.line)||lineName(code)};
  const G=new Map();const row=k=>{if(!G.has(k))G.set(k,{k,open:0,mov:0,close:0});return G.get(k)};
  w.lines.filter(l=>/^BSL2/.test(l.id)).forEach(l=>{const v=w.vals[l.id];if(v&&Math.abs(v.ias29)>=0.005)row(grpOf(l.id)).close+=-v.ias29});
  const baz=O&&O.mode==='baz'&&Array.isArray(O.rows);
  if(baz){O.rows.forEach(r=>{if(r.idx!=null)row(grpOf(r.code)).open+=-r.idx});(O.mrows||[]).forEach(x=>{if(x.km)row(grpOf(x.m.kod)).mov+=(+x.m.tutar||0)*x.km})}
  const P=row('Dönem kârı / (zararı)');P.close+=np;const Q=Math.abs(oci)>=0.005?row('Diğer kapsamlı gelir (dönem)'):null;if(Q)Q.close+=oci;
  const rows=[...G.values()].map(r=>Object.assign(r,{pl:r===P?np:r===Q?oci:0}));rows.forEach(r=>{r.oth=r.close-r.open-r.mov-r.pl});

function fsXMatch(xr,U,kind,map){

function fsChecks(st,kind,M){/* Excel'deki toplamlarla karşılaştır */

function buildContext(){
  const c=curCo();if(!c)return 'Şirket seçilmedi.';
  let s=`Şirket: ${c.name} (${c.activity||'faaliyet belirtilmemiş'})\nDönem: ${periodLabel(S.period)}\nPara birimi: TL\nAçık UFRS modülleri: ${coMods(c).map(m=>modInfo(m).short+' ('+modInfo(m).name+')').join(', ')||'yok'}\nKurumlar vergisi oranı ayarı: %${cfg().settings.taxRate}\n`;
  const meta=S.tbIndex[tbKey(c.id,S.period)];if(!meta)return s+'Bu dönem için mizan yüklenmemiş.\n';
  const w=computeWTB(c.id,S.period,true);if(!w)return s+'Mizan henüz yüklenmedi.\n';
  const n=v=>r2(v).toFixed(2);
  s+=`Mizan: ${w.acc.accs.length} hesap, toplam borç ${n(meta.totalD)}, toplam alacak ${n(meta.totalC)}, fark ${n(meta.totalD-meta.totalC)}\n`;
  if(w.codeMode)s+=`WTB mizandaki IFRS kodlarıyla kurulur (BSA=varlık, BSL=yükümlülük/özkaynak, PL=gelir tablosu). Kodlu bakiye toplamı ${n(w.acc.codeTot)} (BSA ${n(w.acc.catBal.BSA)}, BSL ${n(w.acc.catBal.BSL)}, PL ${n(w.acc.catBal.PL)}); kodsuz ${w.acc.uncoded.length} hesap, bakiye ${n(w.acc.uncodedBal)}.\n`+(w.acc.uncoded.length?w.acc.uncoded.slice(0,60).map(a=>`- KODSUZ ${a.code} ${a.name}: ${n(a.bal)}`).join('\n')+'\n':'');
  if(w.acc.ifrsCnt)s+=`IFRS kod kontrolü (BSA=varlık, BSL=yükümlülük/özkaynak, PL=gelir tablosu) uyumsuz hesaplar (${w.acc.ifrsBad.length}):\n`+w.acc.ifrsBad.slice(0,60).map(a=>`- ${a.code} ${a.name}: mizanda ${a.ifrs}, eşlenen kalem ${(lineById(a.line)||{}).name} (${a.chk.exp})`).join('\n')+'\n';
  s+=`Eşlenmeyen hesaplar (${w.acc.unmapped.length}):\n`+w.acc.unmapped.slice(0,60).map(a=>`- ${a.code} ${a.name}: bakiye ${n(a.bal)}`).join('\n')+'\n';
  s+=`\nUFRS WTB (taslaklar dahil). Varlıklar borç bakiyesi pozitif; yükümlülük, özkaynak ve gelir tablosu alacak pozitif (gider negatif).\nKolonlar: ${w.cols.map(colTitle).join(' | ')} (UFRS = endekssiz UFRS, IAS 29 = enflasyona göre düzeltilmiş)\n`;
  const fmtRows=rows=>rows.filter(r=>r.vals).map(r=>`${r.t==='line'?'  ':''}${r.label}: ${r.vals.map(n).join(' | ')}`).join('\n');
  const keep=S.hideZero;S.hideZero=true;s+='BİLANÇO\n'+fmtRows(buildBS(w).rows)+'\nGELİR TABLOSU\n'+fmtRows(buildIS(w).rows)+'\n';S.hideZero=keep;
  s+=`\nDüzeltme kayıtları (${w.ents.length}):\n`+w.ents.map(e=>`- [${modInfo(e.module).short}${adjLayer(e)==='ias29'?' · IAS 29':''}] ${e.desc||'açıklamasız'} (${e.status==='approved'?'onaylı':'taslak'}): `+(e.lines||[]).map(l=>`${lineName(l.line)} B ${n(l.dr)} A ${n(l.cr)}`).join('; ')).join('\n')+'\n';
  s+=`\nHesap bazında mizan ve eşleme (ilk 400 hesap):\n`+w.acc.accs.slice(0,400).map(a=>`${a.code} ${a.name} | bakiye ${n(a.bal)} | ${w.codeMode?(a.ifrs?lineName(a.ifrs):'IFRS KODU YOK')+' | VUK kural: ':''}${a.line?(lineById(a.line)||{}).name:'EŞLENMEDİ'}`).join('\n');
  if(w.codeMode){s+=`\nIFRS mapping (kod>mali tablo kalemi; bölüm kod önekinden): `+mapAll().list.map(r=>r.code+'>'+r.line).join('; ')+'\n';if(w.acc.nomap.length)s+=`Mapping’de olmayan kodlar: ${w.acc.nomap.map(l=>l.id).join(', ')}\n`}
  const ea=endeksAll();s+=`\nIAS 29 TÜFE endeks tablosu (sisteme gömülü; katsayı = raporlama ayı endeksi / tutarın ait olduğu ayın endeksi). Raporlama ayı ${ymLabel(S.period)} endeksi: ${endeks(S.period)||'YOK'}\n`+Object.keys(ea).sort().map(k=>k+'='+ea[k]).join(' ')+'\n';
  const skS=S.robot[rKey(c.id,'sk')];if(skS&&skS.items&&skS.items.length){const tt=skTotals(skS.items,S.period);s+=`\nSabit kıymet modülü (doğrusal, aktifleştirme ayı tam, takvim yılı): ${skS.items.length} kıymet, maliyet ${n(tt.cost)}, dönem amortismanı ${n(tt.exp)}, dönem sonu birikmiş ${n(tt.end)}, UFRS NDD ${n(tt.nbv)}\n`}
  return s.slice(0,180000);
}
const RULES=`Sen FinStand platformunda çalışan bir UFRS/TFRS raporlama asistanısın. Kullanıcı bir holding grubundaki şirketlerin finans ekibinden. Türkçe, kısa ve net yanıt ver.
Yalnızca aşağıdaki VERİ bölümündeki rakamlara dayan; veride olmayan bir rakamı tahmin etme, yoksa bunu açıkça söyle. Hesap yaparken adımları göster ve tutarları TL olarak, binlik ayırıcıyla yaz.
Kayıt değiştiremezsin. Bir düzeltme önerirsen, kullanıcının Düzeltmeler ekranına girebilmesi için UFRS kalemi adlarıyla borç/alacak satırları olarak yaz.
Standart yorumlarında emin olmadığın noktayı belirt; kesin olmayan konularda denetçi veya uzman görüşü öner.

VERİ:
`;
async function sendChat(q){
  q=(q||'').trim();if(!q||S.chatBusy||!S.sample)return;
  S.chat.push({role:'user',content:q});S.chatDraft='';S.chatBusy=true;
  const turns=[{role:'user',content:RULES+buildContext()+'\n\nVeriyi okuduğunda yalnızca "Hazırım" yaz.'},{role:'assistant',content:'Hazırım.'},...S.chat.map(m=>({role:m.role,content:m.content}))];
  const idx=S.chat.length;S.chat.push({role:'assistant',content:''});
  const ctl=new AbortController();S.chatCtl=ctl;render();
  try{
    const res=await S.sample(turns,{cache:false,signal:ctl.signal,onText:({text})=>{S.chat[idx].content=text;const el=document.getElementById('msg-'+idx);if(el)el.innerHTML=md(text);const log=$('#chatlog');if(log)log.scrollTop=log.scrollHeight}});
    S.chat[idx].content=res.text;if(res.truncated)S.chat[idx].content+='\n\n(Yanıt kısaltıldı; soruyu daraltın.)';
  }catch(e){
    const part=e&&e.text;const msg={not_granted:'Asistan için izin verilmedi.',rate_limited:'Çok sık istek gönderildi; biraz sonra tekrar deneyin.',cancelled:''}[e&&e.code];
    if(part)S.chat[idx].content=part+(e.code==='cancelled'?'\n\n(Durduruldu.)':'');
    else if(e&&e.code==='cancelled')S.chat[idx].content='(Durduruldu.)';
    else{S.chat.splice(idx-1,2);S.chatDraft=q;toast(msg||'Yanıt alınamadı. Tekrar deneyin.','bad')}
  }finally{S.chatBusy=false;S.chatCtl=null;render()}
}

/* ---------- Çerçeve ---------- */
function renderNav(){
  const items=[...VIEWS];if(S.canEdit){items.push(['yonetim','Yönetici Paneli']);items.push(['guide','Kullanım Kılavuzu'])}
  const subs=['ifrsmap','recon','guide'];
  $('#nav').innerHTML=items.map(([v,l])=>(v==='yonetim'?'<div class="sep"></div>':'')+(v==='sk'?'<div class="sep"></div><div class="navlbl">Modüller</div>':'')+`<a href="#${v}"${S.view===v?' aria-current="page"':''}${subs.includes(v)?' class="sub"':''}>${subs.includes(v)?'<span class="tree" aria-hidden="true">↳</span>':''}${l}</a>`+(v==='endeks'?'<div class="sep"></div>':'')).join('');
  const st=cfg().settings;
  $('#foot').innerHTML=`<strong>${esc(st.holding||'Grup Finans')}</strong><span>${S.canEdit?'Yönetici':S.canWrite?'Hazırlayan':'Görüntüleyen'}</span>`;
}
function topHTML(){
  if(S.noDb||!S.ready.co)return '';
  const per=periods();
  return `<div class="top"><div class="fields">
    ${S.view!=='yonetim'&&S.view!=='grup'?`<div class="field"><label for="sel-co">Şirket</label><select id="sel-co">${S.companies.length?S.companies.map(c=>`<option value="${esc(c.id)}"${c.id===S.company?' selected':''}>${esc(c.name)}</option>`).join(''):'<option value="">Şirket yok</option>'}</select></div>`:''}
    <div class="field"><label for="sel-per">Dönem</label><select id="sel-per">${per.map(p=>`<option value="${esc(p)}"${p===S.period?' selected':''}>${periodLabel(p)}</option>`).join('')}</select></div>

}

function ensureRobot(cid,rk){

    if(parts>0){items=[];for(let i=0;i<parts;i++){const ps=await S.db.doc('robotpart/'+key+'__p'+i).get();if(ps.exists&&Array.isArray(ps.data().items))items=items.concat(ps.data().items)}}
    S.robot[key]={items,parts}}catch(e){S.robot[key]={items:[],err:true}}render()})();

async function saveRobot(cid,rk,items){
  const key=rKey(cid,rk);const prev=S.robot[key]||{};const enc=new TextEncoder();
  const chunks=[];let cur=[],sz=0;items.forEach(it=>{const s=enc.encode(JSON.stringify(it)).length+1;if(cur.length&&sz+s>180000){chunks.push(cur);cur=[];sz=0}cur.push(it);sz+=s});if(cur.length||!chunks.length)chunks.push(cur);
  const parts=chunks.length>1?chunks.length:0;S.robot[key]={items,parts};S.busy=true;render();
  try{
    const meta={companyId:cid,module:rk,count:items.length,updatedAt:new Date().toISOString()};
    if(parts){for(let i=0;i<parts;i++)await S.db.doc('robotpart/'+key+'__p'+i).set({key,i,items:chunks[i]});await S.db.doc('robot/'+key).set(Object.assign(meta,{parts,items:[]}))}

  catch(e){S.robot[key]=prev;dbErr(e);return false}

}
function isoDate(v){
  if(v==null||v==='')return '';
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5);return d.toISOString().slice(0,10)}
  const s=String(v).trim();let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  if((m=s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{4})/)))return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return '';
}
function fDate(s){const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[3]}.${m[2]}.${m[1]}`:''}
function rVal(f,v){
  if(f.t==='num')return v===''||v==null?'':r2(num(v));

  return String(v??'').replace(/[\t\r\n]+/g,' ').trim().slice(0,160);
}
function rShow(f,v){

  if(!/\.(xlsx|xls|csv)$/i.test(file.name||'')){toast('Desteklenmeyen dosya türü. Excel (.xlsx, .xls) veya CSV seçin.','bad');return}
  try{
    const RB=await xlRead(await file.arrayBuffer(),file.name);const pn=RB.names.find(n=>/personel/i.test(norm(n)))||RB.names[0];const aoa=RB.sheets[pn]||[];
    const prmN=rk==='kidem'?RB.names.find(n=>/parametre/.test(norm(n))):null;const kpar=prmN?kParseParamSheet(RB.sheets[prmN]):null;
    let hr=0,bs=-1;for(let r=0;r<Math.min(aoa.length,20);r++){const row=(aoa[r]||[]).map(norm);let sc=0;R.fields.forEach(f=>{if(row.some(x=>x&&f.al.some(a=>x===a||x.includes(a))))sc++});if(sc>bs){bs=sc;hr=r}}
    S.rimp={rk,name:file.name,aoa,hr,map:rAutoMap(R,aoa[hr]||[]),kpar};S.rform=null;render();
  }catch(e){toast(e&&e.xls?'İnternetsiz modda eski .xls okunamıyor; dosyayı .xlsx olarak kaydedip yükleyin.':'Dosya okunamadı.','bad')}
}
function rAutoMap(R,hdrRow){
  const row=hdrRow.map(norm);const map={},used=new Set();
  R.fields.forEach(f=>{const i=row.findIndex((x,j)=>!used.has(j)&&x&&f.al.includes(x));if(i>=0){map[f.k]=i;used.add(i)}});
  R.fields.forEach(f=>{if(map[f.k]!=null)return;for(const a of f.al){const i=row.findIndex((x,j)=>!used.has(j)&&x&&x.includes(a));if(i>=0){map[f.k]=i;used.add(i);return}}});
  R.fields.forEach(f=>{if(map[f.k]==null)map[f.k]=-1});return map;
}
function rImpItems(R){
  const p=S.rimp;const out=[];
  for(let r=p.hr+1;r<p.aoa.length;r++){const row=p.aoa[r]||[];const it={};let any=false;
    R.fields.forEach(f=>{const i=p.map[f.k];const v=i>=0?rVal(f,row[i]):'';it[f.k]=v;if(v!==''&&v!=null)any=true});
    if(any)out.push(rStore(R,{},it))}
  return out;
}

/* ---------- Sabit kıymet hesaplama motoru (onaylı kurallar) ----------
   Doğrusal; aylık = (maliyet − kalıntı) ÷ (ömür × 12); aktifleştirme ayı tam ay; hesap dönemi takvim yılı;
   birikmiş amortisman (maliyet − kalıntı)'yı aşmaz. Arsa/arazi ve yapılmakta olan yatırımlara amortisman yok.
   Çıkışta çıkış ayı hariç amortisman; önceki yıllarda çıkanlar hesaplanmaz. */
const SK_NODEP=['Arazi ve arsalar','Yapılmakta olan yatırımlar'];
const SKC=new WeakMap();
/* ---------- Yeniden değerleme (TMS 16 yeniden değerleme modeli, eleme yöntemi) ----------
   Değerleme sınıf bazında girilir: sınıf, değerleme tarihi, değerlenmiş tutar, rapordaki yeni kalan ömür.
   Tutar, değerleme tarihindeki UFRS net defter değerleri oranında o sınıftaki kıymetlere dağıtılır.
   Değerleme tarihinde birikmiş amortisman silinir, kıymet değerlenmiş tutara çıkar, fark yeniden değerleme fonuna gider
   (cari yılın değerlemesi DKG'ye: PL9000; önceki yılların fonu: BSL22511). Sonrasında değerlenmiş tutar yeni kalan ömre itfa edilir.
   IAS 29'da değerlenmiş kıymet değerleme ayından endekslenir (TMS 29.18-19); fon, endeksli defter değerine göre azaltılır. */
const SK_FUND_CODE='BSL22511',SK_OCI_CODE='PL9000';
const SKREV=new WeakMap(),SKREV_DONE=new WeakMap();
function skRevOf(it){return SKREV.get(it)||null}
function ensureSkRev(cid){S.skRev=S.skRev||{};if(S.skRev[cid]||!S.db)return;S.skRev[cid]={loading:true,rows:[]};
  (async()=>{try{const s=await S.db.doc('config/skrev__'+cid).get();S.skRev[cid]={rows:s.exists&&Array.isArray(s.data().rows)?s.data().rows:[]}}catch(e){S.skRev[cid]={rows:[],err:true}}render()})()}
async function saveSkRev(cid,rows){const prev=S.skRev[cid];S.skRev[cid]={rows};render();
  try{await S.db.doc('config/skrev__'+cid).set({companyId:cid,rows,updatedAt:new Date().toISOString()});return true}catch(e){S.skRev[cid]=prev;dbErr(e);render();return false}}
function skRevRowOk(r){return r&&ROBOTS.sk.fields[2].o.includes(r.sinif)&&!isNaN(ymIdx(r.tarih))&&(+r.tutar>0)&&(SK_NODEP.includes(r.sinif)||+r.omur>0)}
/* Segmentler: maliyet esası, sonra her değerlemede yeni esas */
function skSegs(it,revs,nodep,cost,res,L){
  const segs=[{start:ymIdx(it.tarih),basis:cost,dep:cost<0?cost-res:Math.max(0,cost-res),L,end:Infinity,base:ymOf(it.tarih),rv:null}];
  (revs||[]).forEach(v=>{segs[segs.length-1].end=v.rvm;segs.push({start:v.rvm+1,basis:v.fv,dep:Math.max(0,v.fv),L:nodep?0:Math.max(1,Math.round(v.L2)),end:Infinity,base:v.ym,rv:v})});
  const accN=(g,m)=>{const n=Math.min(m,g.end)-g.start+1;return g.L<=0||n<=0?0:n>=g.L?g.dep:g.dep*n/g.L};
  const segAt=m=>{let s=segs[0];segs.forEach(g=>{if(g.rv&&g.rv.rvm<=m)s=g});return s};
  return {segs,accN,segAt};
}
function skNbvBefore(it,m,revs){/* m ayı sonunda, o aydaki değerlemeden hemen önce UFRS net defter değeri */
  const nodep=SK_NODEP.includes(it.sinif);const cost=+it.maliyet||0,res=+it.kalinti||0,L=nodep?0:Math.round((+it.omur||0)*12);
  const G=skSegs(it,(revs||[]).filter(v=>v.rvm<m),nodep,cost,res,L);const g=G.segAt(m);return g.basis-G.accN(g,m);
}
function skRevSync(items){
  if(!items)return;const key=Object.keys(S.robot||{}).find(k=>S.robot[k]&&S.robot[k].items===items);if(!key)return;
  const cid=key.split('__')[0];ensureSkRev(cid);const R=(S.skRev&&S.skRev[cid]||{}).rows||[];
  if(SKREV_DONE.get(items)===R)return;
  items.forEach(it=>SKREV.delete(it));
  const rows=R.filter(skRevRowOk).map(r=>({id:r.id,sinif:r.sinif,tarih:isoDate(r.tarih)||r.tarih,ym:ymOf(r.tarih),rvm:ymIdx(r.tarih),tutar:+r.tutar,L2:SK_NODEP.includes(r.sinif)?0:Math.round(+r.omur*12)})).sort((a,b)=>a.rvm-b.rvm);
  rows.forEach(r=>{
    const el=items.filter(it=>{if(it.sinif!==r.sinif||rMissing(ROBOTS.sk,it).length)return false;const a0=ymIdx(it.tarih);if(isNaN(a0)||a0>r.rvm)return false;const d0=it.cikis?ymIdx(it.cikis):NaN;return isNaN(d0)||d0>r.rvm});
    const w=el.map(it=>Math.max(0,skNbvBefore(it,r.rvm,SKREV.get(it))));let sw=w.reduce((a,b)=>a+b,0);
    const w2=sw>0?w:el.map(it=>+it.maliyet||0);if(!(sw>0))sw=w2.reduce((a,b)=>a+b,0);if(!(sw>0))return;
    el.forEach((it,i)=>{const l=(SKREV.get(it)||[]).slice();l.push({row:r.id,rvm:r.rvm,ym:r.ym,tarih:r.tarih,fv:r.tutar*w2[i]/sw,L2:r.L2,nbvR:w[i]});SKREV.set(it,l)});
  });
  SKREV_DONE.set(items,R);S.skRevVer=(S.skRevVer||0)+1;
}
/* ---------- VUK amortismanı (kıymette VUK değeri girilmemişse otomatik) ----------
   VUK md. 313-321: doğrusal yöntem, oran = 1 ÷ VUK faydalı ömrü (amortisman listesi); kalıntı değer yok.
   Aktifleştirme yılında tam yıllık amortisman (kıst yok); satış/çıkış yılında amortisman ayrılmaz.
   Ara dönemlerde yıllık tutar aylara yayılır: Ocak–raporlama ayı (giriş yılında giriş ayı–Aralık arasında).
   Birikmiş amortisman maliyeti aşmaz. VUK ömrü boşsa sınıf varsayılanı kullanılır. */
const SK_VUK_OMUR={'Yeraltı ve yerüstü düzenleri':10,'Binalar':50,'Tesis, makine ve cihazlar':10,'Taşıtlar':5,'Demirbaşlar':5,'Özel maliyetler':5,'Diğer':5};
function skVukLife(it){const v=+String(it.vukOmur??'').replace(',','.');return v>0?v:(SK_VUK_OMUR[it.sinif]||5)}
function skVuk(it,period,disp){
  const cost=+it.maliyet||0;const a0=ymIdx(it.tarih);if(isNaN(a0))return null;
  const Lv=skVukLife(it);const ann=cost/Lv;const [Y,M]=String(period).split('-').map(Number);const ay=Math.floor(a0/12),am=a0%12+1;
  const beg=Math.min(cost,ann*Math.max(0,Y-ay));
  if(disp)return {bir:r2(beg),don:0,L:Lv,ann:r2(ann)};
  const yr=Math.max(0,Math.min(ann,cost-beg));const f=Y===ay?(M-am+1)/(13-am):M/12;const don=yr*Math.max(0,Math.min(1,f));
  return {bir:r2(beg+don),don:r2(don),L:Lv,ann:r2(ann)};
}
function skAutoShow(f,it,v){
  if(!(v[f.k]===''||v[f.k]==null)||SK_NODEP.includes(it.sinif))return null;
  if(f.k==='vukOmur')return `<span class="muted" title="Sınıf varsayılanı (VUK amortisman listesi)">${NF2.format(skVukLife(it)).replace(/,00$/,'')} <span class="chip">oto</span></span>`;
  if(f.k!=='vukBir'&&f.k!=='vukDon')return null;const x=skCalc(it,S.period);if(x.st!=='ok'||!x.vukAuto)return null;
  return `<span class="muted" title="VUK kurallarıyla hesaplandı">${NF2.format(f.k==='vukBir'?x.vukBir:x.vukDon)} <span class="chip">oto</span></span>`;
}
/* Açılışlı şirket: dönem amortismanı = SAP yıllık amortisman ÷ 12 × cari yıldaki ay. Ömür yalnızca bitiş kontrolü
   (aktifleştirme ayı tam ay; ömür × 12 ay dolunca durur, ondalık aynen). Yıllık 0 veya ömür 0 → amortisman yok. */
function skEsas(v){const n=norm(v);if(/^yok|amortisman yok|^none/.test(n))return 'yok';if(/net/.test(n))return 'net';return 'maliyet'}
/* Açılışlı şirket (TMS 16 doğrusal). Esas = MALİYET: aylık = maliyet ÷ (ömür × 12), aktifleştirme ayı tam ay, ömür × 12 ay dolunca durur.
   Esas = NET DEĞER: net = maliyet − UFRS birikmiş (önceki yıl sonu); geçen ay = aktifleştirme ayı..Aralık (dahil); kalan = ömür × 12 − geçen;
   aylık = net ÷ kalan (kalan ≤ 0 ise net değerin tamamı); net sıfıra inince durur. Esas = YOK: amortisman yok. Ömür aynen kullanılır. */
function skCalcSap(it,period){
  const cost=+it.maliyet||0;const [Y,M]=String(period).split('-').map(Number);const r=Y*12+M-1;const a0=ymIdx(it.tarih);
  if(isNaN(a0))return {st:'eksik'};if(a0>r)return {st:'gelecek',cost};
  const d0=it.cikis?ymIdx(it.cikis):NaN;if(!isNaN(d0)&&d0<Y*12)return {st:'gone',cost};
  const es=skEsas(it.esas);const lifeY=+it.omur||0;const L=lifeY*12;const cut=Y*12-1;

/* ---------- IFRS mapping: IFRS kodu → mali tablo kalemi ve dipnot ----------

const MAP_SECS=[['BSA1','donen'],['BSA','duran'],['BSL11','kv'],['BSL12','uv'],['BSL2','oz'],['PL1','brut'],['PL2','faaliyet'],['PL3','yatirim'],['PL4','finans'],['PL5','vergi'],['PL','dkg']];

  if(MAPC&&MAPC.v===S.mapVer)return MAPC;

  MAP_DEFAULT.forEach(([c,en,line,dip])=>{const o=ov[c];if(o&&o.del)return;const r={code:c,en,line:(o&&o.line)||line,dip:o&&o.dip!=null?o.dip:dip,ov:!!o,def:{line,dip}};list.push(r);by[c]=r});
  Object.keys(ov).forEach(c=>{if(by[c]||ov[c].del)return;const o=ov[c];const r={code:c,en:o.en||'',line:o.line||'',dip:o.dip||'',ov:true,added:true};list.push(r);by[c]=r});
  const order={};list.forEach((r,i)=>{if(r.line&&order[r.line]==null)order[r.line]=i});

}

    if(!r.line)add('Mali tablo kalemi boş');
    if(g==='kv'&&/uzun vadeli/.test(ln)&&!/kisa vadeli/.test(ln))add(`Kısa vadeli bölüm kodu “${r.line}” kalemine gidiyor`);
    if(g==='uv'&&/kisa vadeli/.test(ln))add(`Uzun vadeli bölüm kodu “${r.line}” kalemine gidiyor`);
    if(g==='donen'&&/duran varlik/.test(ln))add(`Dönen varlık kodu “${r.line}” kalemine gidiyor`);
    if(g==='duran'&&/donen varlik/.test(ln))add(`Duran varlık kodu “${r.line}” kalemine gidiyor`);
    if(/goodwill/i.test(r.en)&&!/serefiye/.test(ln))add(`Şerefiye kodu “${r.line}” kalemine gidiyor`);
    if(/ifrs ?16/i.test(r.en)&&/finance|interest/i.test(r.en)&&g!=='finans')add(`IFRS 16 faiz gideri finansman giderleri dışında (${GROUPS[g]?GROUPS[g].opt:g})`);
    if(/investment property/i.test(r.en)&&/maddi duran/.test(ln))add('Yatırım amaçlı gayrimenkul (TMS 40) maddi duran varlıklar içinde');
    if(/other (receivables|payables)/i.test(r.en)&&/ticari/.test(ln))add(`Diğer alacak/borç kodu ticari kaleme (“${r.line}”) gidiyor`);
  });
  const grp={};list.forEach(r=>{const en=String(r.en).toLowerCase().trim();if(!en||en==='other'||en==='others'||!/^BS/.test(r.code))return;const k=r.code.slice(0,5)+'|'+en;(grp[k]=grp[k]||[]).push(r)});
  Object.values(grp).forEach(rs=>{const ls=[...new Set(rs.map(r=>r.line))];const lsN=new Set(ls.map(l=>norm(l).replace(/\(amortisman\)/g,'').trim()));if(lsN.size<2)return;if(rs.length>1&&ls.length>1)w.push({code:rs.map(r=>r.code).join(', '),codes:rs.map(r=>r.code),msg:`Aynı hesap adı (“${rs[0].en}”) aynı bölümde farklı kalemlere gidiyor: ${ls.join(' / ')}`})});
  return w;
}

/* ---------- Sabit kıymet düzeltme kayıtları ----------

const SK_ACC_CODE={'Yeraltı ve yerüstü düzenleri':'BSA2611','Binalar':'BSA2612','Tesis, makine ve cihazlar':'BSA2613','Taşıtlar':'BSA2615','Demirbaşlar':'BSA2616','Özel maliyetler':'BSA2618','Diğer':'BSA2619'};
const SK_COST_CODE={'Arazi ve arsalar':'BSA2601','Yeraltı ve yerüstü düzenleri':'BSA2602','Binalar':'BSA2603','Tesis, makine ve cihazlar':'BSA2604','Taşıtlar':'BSA2606','Demirbaşlar':'BSA2607','Özel maliyetler':'BSA2609','Yapılmakta olan yatırımlar':'BSA2620','Diğer':'BSA2621'};
const SK_EXP_CODE='PL1217',SK_RE_CODE='BSL2210',SK_LOSS_CODE='PL3201',SK_GAIN_CODE='PL3102',SK_NPMP_CODE='PL4300';
function skLines(L,why){
  const ord=c=>/^BSA26(0|2[01])/.test(c)?0:/^BSA/.test(c)?1:c===SK_EXP_CODE?2:/^PL3/.test(c)?3:c===SK_NPMP_CODE?4:5;
  return Object.keys(L).sort((a,b)=>ord(a)-ord(b)||a.localeCompare(b)).map(c=>{const v=r2(L[c]);return Math.abs(v)<0.005?null:{line:c,dr:v>0?v:0,cr:v<0?-v:0,why:why(c,v)}}).filter(Boolean);

  R.fields.forEach(f=>{if(f.p){if(vals[f.k]!==undefined)pv[f.k]=vals[f.k]}else if(vals[f.k]!==undefined)it[f.k]=vals[f.k]});
  if(R.fields.some(f=>f.p)){const vuk=Object.assign({},it.vuk||{});const any=Object.values(pv).some(x=>x!==''&&x!=null);if(any)vuk[S.period]=pv;else delete vuk[S.period];if(Object.keys(vuk).length)it.vuk=vuk;else delete it.vuk}
  return it;
}

async function handleFile(file){

function detectCols(){
  const p=S.parse;const aoa=p.sheets[p.sheet]||[];
  const reC=/hesap ?kod|^kod|hesap ?no|hesap numaras/,reN=/hesap ?ad|aciklama|hesap ismi|^ad$|^unvan|^isim/;
  let best=-1,bs=0;
  for(let r=0;r<Math.min(40,aoa.length);r++){const row=(aoa[r]||[]).map(norm);let sc=0;if(row.some(x=>reC.test(x)))sc++;if(row.some(x=>reN.test(x)))sc++;if(row.some(x=>/borc/.test(x)))sc++;if(row.some(x=>/alacak/.test(x)))sc++;if(row.some(x=>/bakiye/.test(x)))sc++;if(row.some(x=>/ifrs|ufrs|tfrs/.test(x)))sc++;if(sc>bs){bs=sc;best=r}}
  const cols={code:0,name:1,d:2,c:3,b:2,k:-1,kn:-1};let mode='bakiye';
  if(best>=0&&bs>=2){
    const row=aoa[best].map(norm);
    const find=(re,not)=>{let i=row.findIndex(x=>re.test(x)&&!(not&&not.test(x)));if(i<0)i=row.findIndex(x=>re.test(x));return i};
    const isNm=x=>/(adi$|ad$| ad |aciklama|isim|tanim)/.test(x);
    const ki=row.findIndex(x=>/(ifrs|ufrs|tfrs)/.test(x)&&!isNm(x));
    const kni=row.findIndex((x,i)=>i!==ki&&/(ifrs|ufrs|tfrs|wtb)/.test(x)&&isNm(x));
    const reCx=/hesap ?kod|^kod|hesap ?no|hesap numaras/;
    const ci=row.findIndex((x,i)=>i!==ki&&i!==kni&&reCx.test(x));let ni=row.findIndex((x,i)=>i!==ki&&i!==kni&&reN.test(x));const di=find(/borc/,/bakiye/),ai=find(/alacak/,/bakiye/);
    let bi=row.findIndex(x=>/bakiye/.test(x)&&!/borc|alacak/.test(x));
    if(ci>=0)cols.code=ci;if(ni>=0)cols.name=ni;if(di>=0)cols.d=di;if(ai>=0)cols.c=ai;if(ki>=0)cols.k=ki;if(kni>=0)cols.kn=kni;
    if(bi>=0){cols.b=bi;mode='bakiye'}else if(di>=0&&ai>=0)mode='ba';
    p.headerRow=best;
  }else p.headerRow=-1;
  p.cols=cols;p.mode=mode;
}

/* ---------- Reeskont (TFRS 9, etkin faiz) ----------
   Cari liste şirket ve dönem bazında (robot/<şirket>__rees__<dönem>); parametreler robot/<şirket>__reesp.
   PV = bakiye ÷ (1 + r)^(gün/365); reeskont = bakiye − PV. Açılış (31 Aralık) reeskontu BSL2210'a, dönem farkı PL'ye. */
const REES_RULES=[
  ['Kapsam','Cari listedeki 120/121 (alacak) ve 320/321 (borç) hesapları. Doğal bakiyesinin tersine bakiye veren cariler (alacak bakiyeli müşteri, borç bakiyeli satıcı) reeskonta girmez.'],
  ['Vade','Cari bazında vade günü girildiyse o; girilmediyse ilgili listenin devir hızı (gün). Vadesi geçmiş ya da sıfır gün olan bakiyeler reeskont edilmez.'],
  ['İskonto','Yıllık efektif iskonto oranı para birimi bazında girilir. Bugünkü değer = bakiye ÷ (1 + oran)^(gün ÷ 365); reeskont = bakiye − bugünkü değer.'],
  ['Açılış','31 Aralık reeskontu, Aralık listesi yüklüyse aynı kurallarla hesaplanır; değilse elle girilir. Açılış tutarı geçmiş yıllar kârlarına (BSL2210), dönem farkı gelir tablosuna.'],
  ['IFRS kodları','Alacak: BSA12021 (ilişkili taraf BSA1212), gider PL2405. Borç: BSL11321 (ilişkili taraf BSL1146), gelir PL2303.'],
  ['Mutabakat','Liste toplamları mizandaki 12x ve 32x bakiyeleriyle karşılaştırılır.']
];
function ensureReesP(cid){if(S.db&&!(cid in S.reesp)){S.reesp[cid]=null;(async()=>{try{const s=await S.db.doc('robot/'+cid+'__reesp').get();S.reesp[cid]=s.exists?s.data():{}}catch(e){S.reesp[cid]={}}render()})()}}
async function saveReesP(cid,ym,patch){const d=Object.assign({},S.reesp[cid]||{});const per=Object.assign({},d.per||{});per[ym]=Object.assign({},per[ym]||{},patch);d.per=per;S.reesp[cid]=d;render();try{await S.db.doc('robot/'+cid+'__reesp').set(Object.assign(d,{companyId:cid,updatedAt:new Date().toISOString()}))}catch(e){dbErr(e)}}
function reesCalc(items,P){
  const typ=it=>/^12/.test(String(it.hesap||''))?'A':/^32/.test(String(it.hesap||''))?'B':null;
  const sgn={A:0,B:0};items.forEach(it=>{const k=typ(it);if(k)sgn[k]+=+it.bakiye||0});
  const rows=[];const T={A:{bal:0,d:0,dRel:0,n:0,skip:0},B:{bal:0,d:0,dRel:0,n:0,skip:0}};const miss=new Set();
  items.forEach(it=>{const k=typ(it);if(!k)return;const raw=+it.bakiye||0;const nat=sgn[k]>=0?1:-1;const bal=raw*nat;const o={it,k,bal};
    if(bal<=0){o.st='ters';T[k].skip++;rows.push(o);return}
    const days=it.vade!==''&&it.vade!=null?+it.vade:(k==='A'?+P.dsoA:+P.dsoB);o.days=days;
    if(!(days>0)){o.st=(it.vade===''||it.vade==null)&&!(k==='A'?P.dsoA:P.dsoB)?'gunyok':'vadesiz';if(o.st==='gunyok')miss.add(k==='A'?'Alacak devir hızı':'Borç devir hızı');T[k].bal+=bal;rows.push(o);return}
    const pb=it.pb||'TRY';const r=((P.rates||{})[pb]);if(r===''||r==null){o.st='oranyok';miss.add(pb+' iskonto oranı');T[k].bal+=bal;rows.push(o);return}
    const pv=bal/Math.pow(1+r/100,days/365);o.pv=pv;o.d=bal-pv;o.st='ok';T[k].bal+=bal;T[k].d+=o.d;if(it.iliskili==='Evet')T[k].dRel+=o.d;T[k].n++;rows.push(o)});
  return {rows,T,miss:[...miss]};
}
function reesState(c){
  ensureReesP(c.id);const pp=S.reesp[c.id];if(pp==null)return null;
  const cur=(S.robot[rKey(c.id,'rees')]||{items:[]}).items;const P=(pp.per||{})[S.period]||{};const Cc=reesCalc(cur,P);
  const pv=kidemPrev(S.period);const Pp=(pp.per||{})[pv]||{};
  const pk=c.id+'__rees__'+pv;if(!S.robot[pk]&&S.db){S.robot[pk]={loading:true,items:[]};(async()=>{try{const s=await S.db.doc('robot/'+pk).get();const d=s.exists?s.data():{};let items=Array.isArray(d.items)?d.items:[];if(+d.parts>0){items=[];for(let i=0;i<+d.parts;i++){const ps=await S.db.doc('robotpart/'+pk+'__p'+i).get();if(ps.exists)items=items.concat(ps.data().items||[])}}S.robot[pk]={items,parts:+d.parts||0}}catch(e){S.robot[pk]={items:[]}}render()})()}
  const prevItems=(S.robot[pk]||{items:[]}).items;let open={A:null,B:null,src:''};
  if(prevItems.length){const Cp=reesCalc(prevItems,Pp);if(!Cp.miss.length){open={A:Cp.T.A.d,B:Cp.T.B.d,src:'Aralık '+pv.slice(0,4)+' listesinden'}}else open.src='Aralık listesi var ama parametreleri eksik ('+Cp.miss.join(', ')+')'}
  if(open.A==null&&P.openA!=null&&P.openA!==''){open.A=+P.openA;open.src='Elle girildi'}
  if(open.B==null&&P.openB!=null&&P.openB!==''){open.B=+P.openB;open.src=open.src||'Elle girildi'}
  const L={};const add=(k,v)=>{L[k]=(L[k]||0)+v};const T=Cc.T;
  const oA=open.A||0,oB=open.B||0;
  if(T.A.d){add('BSA12021',-(T.A.d-T.A.dRel));add('BSA1212',-T.A.dRel)}add('PL2405',T.A.d-oA);add('BSL2210',oA);

function fxRate(pb,ym){const v=((S.fx||{})[ym]||{})[pb];return v===''||v==null?null:+v}
function hedgeRel(rel,plan,ym){

  const S0=rel.spot!==''&&rel.spot!=null?+rel.spot:fxRate(pb,d0);if(!S0)z.miss.push(ymLabel(d0)+' '+pb+' kuru');
  const ps=plan.filter(p=>String(p.iliski)===String(rel.no));const As=ps.reduce((s,p)=>s+(+p.tutar||0),0);const sc=As>A&&As>0?A/As:1;const eff=Math.min(A,As);

/* ---------- Krediler: etkin faiz yöntemi (TFRS 9, itfa edilmiş maliyet) ----------
   Nakit akışları: kullanım tarihinde +(anapara − masraf), ödeme planındaki her tarihte −(anapara + faiz). EIR = XIRR (365 gün).
   UFRS defter değeri = kalan ödemelerin EIR ile bugünkü değeri. VUK defter değeri = kalan anapara + tahakkuk eden sözleşme faizi
   (masraf VUK'ta kullanımda gider). Fark açılışta BSL2210, dönem farkı faiz gideri (PL4201), dövizli kredilerde kur etkisi PL4203. */
const KREDI_RULES=[
  ['Etkin faiz oranı','Kullanım tarihindeki net tutar (anapara − komisyon ve masraflar) ile ödeme planındaki anapara + faiz ödemeleri üzerinden günlük XIRR (365 gün).'],
  ['UFRS defter değeri','Raporlama tarihinden sonraki ödemelerin etkin faiz oranıyla bugünkü değeri (itfa edilmiş maliyet).'],
  ['VUK defter değeri','Kalan anapara + son ödeme tarihinden raporlama tarihine kadar tahakkuk eden sözleşme faizi (bir sonraki faiz ödemesinin gün oranı). Komisyon ve masraflar VUK’ta kullanımda gider yazılmış kabul edilir.'],
  ['Kayıt','Fark kredinin IFRS koduna. Açılış (31 Aralık) farkı geçmiş yıllar kârlarına (BSL2210), dönem farkı faiz giderine (PL4201). Dövizli kredilerde açılış farkının kur etkisi kur farkına (PL4203).'],
  ['Kurlar','Dövizli krediler Riskten Korunma modülündeki ay sonu kurlarıyla TL’ye çevrilir.']

function xirr(cfs){
  if(cfs.length<2)return null;const t0=cfs[0].t;const f=r=>cfs.reduce((s,c)=>s+c.v/Math.pow(1+r,(c.t-t0)/365),0);const df=r=>cfs.reduce((s,c)=>{const e=(c.t-t0)/365;return s-e*c.v/Math.pow(1+r,e+1)},0);
  let r=0.1;for(let i=0;i<100;i++){const y=f(r),d=df(r);if(!isFinite(y)||!isFinite(d)||d===0)break;const n=r-y/d;if(!isFinite(n))break;if(Math.abs(n-r)<1e-12){r=n;break}r=n<=-0.99?(r-0.99)/2:n}
  if(Math.abs(f(r))<1e-6*Math.max(1,Math.abs(cfs[0].v)))return r;
  let lo=-0.99,hi=10;let flo=f(lo),fhi=f(hi);if(flo*fhi>0)return null;for(let i=0;i<300;i++){const m=(lo+hi)/2,fm=f(m);if(Math.abs(fm)<1e-9)return m;if(flo*fm<0){hi=m;fhi=fm}else{lo=m;flo=fm}}return (lo+hi)/2;
}
const dayN=s=>{const d=new Date(String(s).slice(0,10)+'T00:00:00Z');return isNaN(d)?null:d/864e5};
function krediCalc(loan,plan,ymEnd){
  const T=dayN(periodEnd(ymEnd));const t0=dayN(loan.tarih);const pb=loan.pb||'TRY';const z={loan,pb,miss:[]};
  const ps=plan.filter(p=>String(p.kredi)===String(loan.no)).map(p=>({t:dayN(p.tarih),a:+p.anapara||0,i:+p.faiz||0,d:p.tarih})).filter(p=>p.t!=null).sort((a,b)=>a.t-b.t);
  if(t0==null){z.miss.push('Kullanım tarihi');return z}if(!ps.length){z.miss.push('Ödeme planı');return z}
  const P=+loan.anapara||0,C=+loan.masraf||0;
  const r=xirr([{t:t0,v:P-C},...ps.map(p=>({t:p.t,v:-(p.a+p.i)}))]);z.eir=r;if(r==null){z.miss.push('Etkin faiz hesaplanamadı');return z}
  const S=pb==='TRY'?1:fxRate(pb,ymEnd);if(!S)z.miss.push(ymLabel(ymEnd)+' '+pb+' kuru');z.S=S;
  if(T<t0){Object.assign(z,{active:false,uf:0,vuk:0,d:0});return z}
  const rem=ps.filter(p=>p.t>T);const uf=rem.reduce((s,p)=>s+(p.a+p.i)/Math.pow(1+r,(p.t-T)/365),0);
  const paidA=ps.filter(p=>p.t<=T).reduce((s,p)=>s+p.a,0);const outA=Math.max(0,P-paidA);
  const nx=rem[0];let acc=0;if(nx){const prev=ps.filter(p=>p.t<=T).pop();const st=prev?prev.t:t0;acc=nx.i*Math.max(0,T-st)/Math.max(1,nx.t-st)}
  const vuk=outA+acc;Object.assign(z,{active:rem.length>0,uf,vuk,outA,acc,d:uf-vuk});return z;
}

  const rows=a.items.map(l=>({cur:krediCalc(l,b.items,ym),op:krediCalc(l,b.items,y0)}));const miss=[...new Set(rows.flatMap(x=>x.cur.miss.concat(x.op.miss.filter(m=>!/kuru$/.test(m)||(x.op.active!==false&&x.op.d)))))];
  const L={};const add=(k,v)=>{L[k]=(L[k]||0)+v};
  rows.forEach(({cur:z,op:o})=>{if(z.miss.length)return;const code=z.loan.kod||'BSL1111';const dT=(z.d||0)*(z.S||1);const d0f=o.miss.length?0:(o.d||0);const S0=o.S||z.S||1;const d0=d0f*S0;

}

/* ---------- TMS 12 vergi modülü ----------
   (1) Dönem vergisi = max(0, VUK vergi öncesi kâr) × efektif oran; IFRS düzeltmeleri etkilemez; geçici vergi mahsup edilir.
   (2) Ertelenmiş vergi: geçici fark = IFRS − VUK (UFRS katmanı ve ayrıca IAS 29 katmanı). Her kalem kategori (ÜRETİM / GENEL / KARMA),
   ters dönüş (12 ay / uzun vade / 2026 payı) ve şirketin üretim durumuna göre oranlanır. Karşı hesap, düzeltmenin gittiği yer
   (K/Z, DKG, özkaynak). Oran değişikliği etkisi ayrı satır. Net EVV kullanıcı onayı olmadan muhasebeleştirilmez. */
const TAX_DEF={gen:25,ur:12.5,ur26:24,start:'2027-01-01'};
const TAX_CATS=['ÜRETİM','GENEL','KARMA'];
function taxDefCat(code){
  if(/^BSA1402$/.test(code))return 'GENEL';if(/^BSA140\d$/.test(code))return 'ÜRETİM';
  if(/^BSA12/.test(code)||/^BSL113/.test(code))return 'ÜRETİM';
  if(/^BSA2601$/.test(code)||/^BSA260[8]$|^BSA2617$/.test(code)||/^BSA(18|27|32)/.test(code)||/^BSL1280$/.test(code))return 'GENEL';
  if(/^BSA26(04|13|14)$/.test(code))return 'ÜRETİM';
  if(/^BSA2[56]/.test(code)||/^BSA31/.test(code)||/^BSL(1191|1290)$/.test(code)||/^BSL122/.test(code)||/^BSL1162$/.test(code)||/^BSL11(1|20)/.test(code)||/^BSL121/.test(code)||/^BSA15/.test(code))return 'KARMA';
  return '';
}
function taxDefRev(code){return /^BSA1|^BSL11/.test(code)?'12':'L'}

function taxParams(){const g=S.taxG||{};const o={};Object.keys(TAX_DEF).forEach(k=>{o[k]=g[k]===''||g[k]==null?TAX_DEF[k]:g[k]});return o}
function taxRateFor(code,C,P,Y,M){
  const gen=+P.gen/100;if(C.uretim!=='Evet')return {r:gen,cat:C.cat&&C.cat[code]||taxDefCat(code)};
  const cat=(C.cat&&C.cat[code]!=null)?C.cat[code]:taxDefCat(code);if(!cat)return {r:null,cat:''};
  const sY=+String(P.start).slice(0,4);const rU=y=>y>=sY?+P.ur/100:y===sY-1?+P.ur26/100:gen;
  const rv=(C.rev&&C.rev[code])||taxDefRev(code);
  let ru;if(rv==='12'){const f=(12-M)/12;ru=f*rU(Y)+(1-f)*rU(Y+1)}else if(String(rv).startsWith('P')){const f=Math.min(1,Math.max(0,(+String(rv).slice(1)||0)/100));ru=f*rU(sY-1)+(1-f)*rU(sY)}else ru=rU(Math.max(Y+1,sY));
  if(cat==='GENEL')return {r:gen,cat};if(cat==='ÜRETİM')return {r:ru,cat};
  const p=C.p===''||C.p==null?null:Math.min(1,Math.max(0,(+C.p)/100));return {r:p==null?gen:p*ru+(1-p)*gen,cat,noP:p==null};
}
const TAX_SKIP=/^(BSA2900|BSA2300|BSL1240|BSL11541|BSA1603|BSL1175)$/,TAX_REVAL=/^BSL22512$/,TAX_DT=/^(BSA2900|BSA2300|BSL1240)$/;
function taxEqTo(k){return k==='BSL22081'?'BSL22082':k==='BSL22151'?'BSL22152':k==='BSL22511'?'BSL22512':'BSL2210'}

/* Geçici fark bilanço kalemi bazında (kayıtların BS satırları). Değerleme fonu (BSL22511) farktan düşülmez;
   yalnızca vergi karşılığının yönünü belirler (→ BSL22512). part: 'cur' = cari yıl kayıtları (robot bunların
   vergisini hesaplar), 'open' = UFRS Açılış sanal kayıtları (yalnızca bilgi amaçlı kontrol). */
function taxDiffs(c,w,layer,part){
  const ents=adjFor(c.id,S.period,S.drafts).filter(e=>adjLayer(e)===layer&&e.module!=='TMS12');const by={};
  ents.forEach(e=>{const op=!!(e.virtual||e.src==='acilis');if(part==='cur'&&op)return;if(part==='open'&&!op)return;const L=(e.lines||[]).map(l=>({k:l.line,v:(+l.dr||0)-(+l.cr||0)}));
    const isBS=k=>/^(BSA|BSL1)/.test(k)&&!TAX_SKIP.test(k);const pl=L.filter(x=>/^PL[1-5]/.test(x.k)).reduce((s,x)=>s+x.v,0);
    const dk={},eq={};L.forEach(x=>{if(/^PL[6-9]/.test(x.k))dk[x.k]=(dk[x.k]||0)+x.v;if(/^BSL2/.test(x.k)&&!TAX_REVAL.test(x.k))eq[x.k]=(eq[x.k]||0)+x.v});

      const put=(f,of,k,v)=>{o[f][k]=(o[f][k]||0)+v;if(op)o[of][k]=(o[of][k]||0)+v};
      if(Math.abs(tot)<0.005){if(op)put('eq','oeq','BSL2210',x.v);else o.pl+=x.v;return}

}

/* ---------- UFRS Açılış (geçmiş yıllar) ----------

async function makeLocalDB(seed){
  const mem=new Map(),subs=new Set();const ns='finstand-'+(seed.id||'x');let idb=null;
  try{idb=await new Promise((res,rej)=>{const r=indexedDB.open(ns,1);r.onupgradeneeded=()=>r.result.createObjectStore('docs');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){idb=null}
  const tx=(mode,fn)=>new Promise((res,rej)=>{const t=idb.transaction('docs',mode);const st=t.objectStore('docs');const out=fn(st);t.oncomplete=()=>res(out&&out.result);t.onerror=()=>rej(t.error)});
  let loaded=false;
  if(idb){try{const keys=await tx('readonly',st=>st.getAllKeys());const vals=await tx('readonly',st=>st.getAll());if(keys&&keys.length){keys.forEach((k,i)=>mem.set(k,vals[i]));loaded=true}}catch(e){}}
  if(!loaded){Object.entries(seed.docs||{}).forEach(([k,v])=>mem.set(k,v));if(idb){try{await tx('readwrite',st=>{mem.forEach((v,k)=>st.put(v,k))})}catch(e){}}}
  S.localPersist=!!idb;
  const cl=v=>v==null?v:JSON.parse(JSON.stringify(v));
  const persist=(k,v)=>{if(!idb)return;tx('readwrite',st=>v===undefined?st.delete(k):st.put(v,k)).catch(()=>{})};
  let pend=false;const notify=()=>{if(pend)return;pend=true;setTimeout(()=>{pend=false;subs.forEach(f=>{try{f()}catch(e){}})},0)};
  const snap=k=>({id:k.split('/').pop(),exists:mem.has(k),data:()=>cl(mem.get(k))});
  const docRef=k=>({path:k,id:k.split('/').pop(),
    get:async()=>snap(k),
    set:async d=>{const v=cl(d);if(new TextEncoder().encode(JSON.stringify(v)).length>262144)throw Object.assign(new Error('Belge çok büyük'),{code:'invalid_argument'});mem.set(k,v);persist(k,v);notify()},
    update:async d=>{const v=Object.assign({},mem.get(k)||{},cl(d));mem.set(k,v);persist(k,v);notify()},
    delete:async()=>{mem.delete(k);persist(k,undefined);notify()},
    onSnapshot:(cb)=>{const f=()=>cb(snap(k));subs.add(f);setTimeout(f,0);return()=>subs.delete(f)}});
  const colDocs=c=>[...mem.keys()].filter(k=>k.startsWith(c+'/')&&k.split('/').length===c.split('/').length+1).sort().map(k=>snap(k));
  const colRef=c=>({path:c,doc:id=>docRef(c+'/'+id),get:async()=>({docs:colDocs(c),size:colDocs(c).length}),onSnapshot:(cb)=>{const f=()=>{const d=colDocs(c);cb({docs:d,size:d.length})};subs.add(f);setTimeout(f,0);return()=>subs.delete(f)}});
  return {doc:docRef,collection:colRef,_reset:async()=>{if(idb)await tx('readwrite',st=>st.clear());}};
}

function kzKey(code){const g=mapSec(code);if(!g)return null;const mp=mapOf(code);return g+'|'+(mp&&mp.line?mp.line:'Mapping’de olmayan kod · '+code)}

function kzCo(cid,layer){
  const r=fsW(cid,S.period);if(r.st!=='ok')return r;const w=r.w;const col=layer==='ias29'?'ias29':'ufrs';const v={};

  const addK=k=>{if(keys.has(k))return;const i=k.indexOf('|');keys.set(k,{key:k,g:k.slice(0,i),label:k.slice(i+1)})};
  D.forEach(d=>{if(d.r.st==='ok')Object.keys(d.r.v).forEach(addK)});Object.keys(E.bs).forEach(addK);Object.keys(E.pl).forEach(addK);
  const items=[...keys.values()].filter(x=>GROUP_ORDER.includes(x.g)).map(x=>Object.assign(x,{o:ord(x.label)})).sort((a,b)=>GROUP_ORDER.indexOf(a.g)-GROUP_ORDER.indexOf(b.g)||a.o-b.o||a.label.localeCompare(b.label,'tr'));

const KZ_IS=['brut','faaliyet','yatirim','finans','vergi','dkg'];
function kzRows(Mo,kind){
  const W=Mo.n+4;const z=()=>Array(W).fill(0);const add=(a,b)=>a.map((x,i)=>x+b[i]);const rows=[];

  h+=`<div class="row sp" style="gap:12px;flex-wrap:wrap"><div class="row"><label class="lbl" for="kz-set">Konsolidasyon</label><select id="kz-set">${S.kons.map(s=>`<option value="${esc(s.id)}"${s.id===set.id?' selected':''}>${esc(s.name)}</option>`).join('')}</select><span class="small muted">${(set.companies||[]).length} şirket</span></div>
    <div class="tabs" role="tablist" aria-label="Katman"><button role="tab" aria-selected="${layer==='ufrs'}" data-act="kz-layer" data-t="ufrs">UFRS (endekssiz)</button><button role="tab" aria-selected="${layer==='ias29'}" data-act="kz-layer" data-t="ias29">IAS 29</button></div></div>`;
  const ne=kzEnts(set,S.period).length;
  h+=`<div class="tabs" role="tablist" aria-label="Konsolidasyon bölümleri">${[['wtb','Konsolide WTB'],['elim','Eliminasyonlar · '+ne],['ayar','Şirketler ve oranlar'],['kural','Kural seti']].map(([k,l])=>`<button role="tab" aria-selected="${tab===k}" data-act="kz-tab" data-t="${k}">${esc(l)}</button>`).join('')}</div>`;
  if(tab==='ayar'){
    if(!S.kzF||S.kzF.id!==set.id)S.kzF={id:set.id,name:set.name||'',sel:Object.fromEntries((set.companies||[]).map(id=>[id,true])),parent:set.parent||'',pct:Object.assign({},set.pct||{})};
    h+=kzForm(S.kzF);
    if(S.canEdit)h+=`<div class="row">${S.kzDel==='set:'+set.id?`<button class="btn danger" data-act="kz-sdel">Konsolidasyonu ve eliminasyonlarını silmeyi onayla</button><button class="btn" data-act="kz-nodel">Vazgeç</button>`:'<button class="btn ghost danger" data-act="kz-sdel">Bu konsolidasyonu sil</button>'}</div>`;
    return h;
  }
  if(tab==='kural')return h+`<section class="card"><div class="ch"><div><h2>Kural seti</h2><p>Konsolidasyon modülünün uyguladığı kurallar.</p></div><span class="pill ok">${KZ_RULES.length} / ${KZ_RULES.length} tanımlı</span></div><ol class="rules">${KZ_RULES.map(([t_,d],i)=>`<li><span class="ix">${i+1}</span><div class="tt"><strong>${esc(t_)}</strong><span class="def">${esc(d)}</span></div><span class="pill ok">Tanımlandı</span></li>`).join('')}</ol></section>`;
  const Mo=kzModel(set,layer);
  if(!Mo.cos.length)return h+empty('Bu konsolidasyonda şirket yok','“Şirketler ve oranlar” sekmesinden şirket seçin.');
  if(Mo.loading)return h+loadingCard();
  if(tab==='elim'){
    const prev=ymAdd(S.period,-1);
    h+=`<div class="row sp" style="gap:12px;flex-wrap:wrap">${S.canWrite&&!S.kzE?'<div class="row"><button class="btn primary" data-act="kz-enew" data-k="bs">Bilanço eliminasyonu ekle</button><button class="btn primary" data-act="kz-enew" data-k="pl">Gelir tablosu eliminasyonu ekle</button></div>':'<span></span>'}
      ${S.canWrite?`<div class="row"><label class="lbl" for="kz-from">Kopyalanacak dönem</label><input id="kz-from" type="month" value="${esc(prev)}"><button class="btn" data-act="kz-copy">Önceki dönemden kopyala</button></div>`:''}</div>`;
    if(S.kzE)h+=kzEForm();
    const all=kzEnts(set,S.period);const bs=all.filter(e=>e.kind!=='pl'),pl=all.filter(e=>e.kind==='pl');
    h+=`<h2 style="font-size:16px;margin:8px 0 0">Bilanço eliminasyonları · ${bs.length}</h2>`+(bs.map(kzECard).join('')||empty('Bilanço eliminasyonu yok','Grup içi alacak/borç, yatırım–sermaye, grup içi temettü borcu gibi kayıtları buraya girin.'));
    h+=`<h2 style="font-size:16px;margin:8px 0 0">Gelir tablosu eliminasyonları · ${pl.length}</h2>`+(pl.map(kzECard).join('')||empty('Gelir tablosu eliminasyonu yok','Grup içi satış/alış, kira, faiz, hizmet ve temettü gelirlerini buraya girin.'));
    const B=kzRows(Mo,'bs');const rp=B.rows.filter(r=>r.rp);
    if(rp.length)h+=`<section class="card"><div class="ch"><div><h2>Grup içi bakiyeler · ${layer==='ias29'?'IAS 29':'UFRS'}</h2><p>İlişkili taraf kalemlerinin şirket bazında dağılımı; eliminasyonları buna göre girin.</p></div></div>${kzTable(rp.map(r=>Object.assign({},r,{t:'line'})),Mo)}</section>`;
    return h;
  }
  const B=kzRows(Mo,'bs'),I=kzRows(Mo,'is');const N=kzNci(set,Mo,B);kzMemo(B,I,N);const K=Mo.n+3;
  const st=Mo.D.map(d=>d.r.st==='none'?`<span class="pill bad">${esc(d.c.name)}: mizan yok</span>`:Math.abs(d.r.diff||0)>=0.5?`<span class="pill bad">${esc(d.c.name)}: solo bilanço farkı ${fa(d.r.diff)}</span>`:`<span class="pill ok">${esc(d.c.name)}</span>`).join('');
  const de=B.diff[Mo.n+1]+B.diff[Mo.n+2];
  h+=`<div class="row" style="gap:6px;flex-wrap:wrap">${st}${Math.abs(B.diff[K])<0.5?'<span class="pill ok">Konsolide varlıklar = kaynaklar</span>':`<span class="pill bad">Konsolide bilanço farkı ${fa(B.diff[K])}</span>`}${Math.abs(de)>=0.5?'<span class="pill bad">Eliminasyonlar dengede değil</span>':''}${Mo.bad.length?`<span class="pill bad">Tanınmayan kod: ${esc(Mo.bad.join(', '))}</span>`:''}${!set.parent?'<span class="pill warn">Ana ortaklık seçilmedi</span>':''}</div>
  <div class="row sp" style="gap:12px;flex-wrap:wrap"><div class="tabs" role="tablist" aria-label="Tablo"><button role="tab" aria-selected="${(S.kzSt||'bs')==='bs'}" data-act="kz-st" data-t="bs">Konsolide bilanço</button><button role="tab" aria-selected="${S.kzSt==='is'}" data-act="kz-st" data-t="is">Konsolide gelir tablosu</button></div>
  <div class="row small muted"><label class="row" style="gap:6px"><input type="checkbox" class="chk" id="kz-drafts"${S.drafts?' checked':''}> Solo taslak düzeltmeleri dahil et</label><label class="row" style="gap:6px"><input type="checkbox" class="chk" id="kz-zero"${S.hideZero?' checked':''}> Boş kalemleri gizle</label><button class="btn" data-act="kz-xls">Excel'e aktar</button></div></div>`;
  h+=`<section class="card"><div class="ch"><div><h2>${esc(set.name)} · ${S.kzSt==='is'?'konsolide gelir tablosu':'konsolide bilanço'}</h2><p>${layer==='ias29'?'IAS 29 (endeksli)':'UFRS (endekssiz)'} · ${esc(periodLabel(S.period))} · ${esc(unitLabel())}</p></div></div>${kzTable(S.kzSt==='is'?I.rows:B.rows,Mo)}</section>`;
  if(N.rows.length)h+=`<section class="card"><div class="ch"><h2>Kontrol gücü olmayan paylar</h2><span class="small muted">${esc(unitLabel())}</span></div><div class="tw"><table><thead><tr><th>Bağlı ortaklık</th><th class="num">Etkin sahiplik</th><th class="num">KGOP oranı</th><th class="num">KGOP · özkaynak</th><th class="num">KGOP · dönem kârı</th></tr></thead><tbody>${N.rows.map(r=>`<tr><td>${esc(r.c.name)}</td><td class="num">%${NF2.format(r.own)}</td><td class="num">%${NF2.format(r.n*100)}</td><td class="num">${fa(r.eq)}</td><td class="num">${fa(r.net)}</td></tr>`).join('')}<tr class="tot"><td colspan="3">Toplam</td><td class="num">${fa(N.eq)}</td><td class="num">${fa(N.net)}</td></tr></tbody></table></div></section>`;
  h+=`<p class="note">Şirket sütunları solo UFRS WTB’nin ${layer==='ias29'?'IAS 29':'UFRS (endekssiz)'} kolonundan gelir. Eliminasyonlar “Eliminasyonlar” sekmesinde girilir; bilanço ve gelir tablosu eliminasyonları ayrı sütunlarda görünür. Grup içi kalemlerde konsolide tutar kalırsa satırda “grup içi?” uyarısı çıkar.</p>`;
  return h;
}
async function kzSaveSet(){
  const f=S.kzF;if(!f)return;const companies=S.companies.filter(c=>f.sel[c.id]).map(c=>c.id);
  if(!companies.length){toast('En az bir şirket seçin.','bad');return}
  if(!f.parent||!companies.includes(f.parent)){toast('Ana ortaklığı seçin.','bad');return}
  const pct={};companies.forEach(id=>{if(id!==f.parent){const v=f.pct[id];pct[id]=v===''||v==null?100:Math.max(0,Math.min(100,+v))}});
  const now=new Date().toISOString();const id=f.id||('k'+uid());const prev=(S.kons||[]).find(s=>s.id===id);
  try{await S.db.doc('kons/'+id).set({name:(f.name||'').trim()||'Grup konsolide',companies,parent:f.parent,pct,createdAt:prev?prev.createdAt:now,updatedAt:now});
    S.kzSet=id;LS.set('kzSet',id);S.kzF=null;S.kzTab='wtb';toast(f.id?'Konsolidasyon güncellendi.':companies.length+' şirket konsolide edildi.');render()}catch(e){dbErr(e)}
}
async function kzSaveE(){
  const E=S.kzE,set=kzSetCur();if(!E||!set)return;
  const lines=E.lines.map(l=>({line:l.line,dr:r2(num(l.dr)),cr:r2(num(l.cr))})).filter(l=>l.line&&(l.dr||l.cr));
  const d=lines.reduce((s,l)=>s+l.dr,0),c=lines.reduce((s,l)=>s+l.cr,0);
  if(!lines.length||Math.abs(d-c)>0.005){toast('Borç ve alacak toplamı eşit olmalı.','bad');return}
  const now=new Date().toISOString();
  try{await S.db.doc('kelim/'+(E.id||('e'+uid()))).set({setId:set.id,period:S.period,kind:E.kind==='pl'?'pl':'bs',layer:E.layer||'both',desc:(E.desc||'').trim(),lines,createdAt:E.createdAt||now,updatedAt:now});S.kzE=null;toast('Eliminasyon kaydedildi.');render()}catch(e){dbErr(e)}
}
async function kzCopy(){
  const set=kzSetCur();if(!set)return;const from=(document.getElementById('kz-from')||{}).value||'';
  if(!/^\d{4}-\d{2}$/.test(from)||from===S.period){toast('Kopyalanacak başka bir dönem seçin.','bad');return}
  const src=kzEnts(set,from);if(!src.length){toast(periodLabel(from)+' için eliminasyon yok.','bad');return}
  const now=new Date().toISOString();
  try{for(const e of src)await S.db.doc('kelim/e'+uid()).set({setId:set.id,period:S.period,kind:e.kind,layer:e.layer||'both',desc:e.desc||'',lines:e.lines||[],copiedFrom:from,createdAt:now,updatedAt:now});
    toast(src.length+' eliminasyon '+periodLabel(from)+' döneminden kopyalandı.')}catch(err){dbErr(err)}
}
async function kzExport(){
  const set=kzSetCur();if(!set)return;if(!S.dl&&!S.offline){toast('Bu görünümde dosya indirilemiyor.','bad');return}
  const layer=S.kzLayer==='ias29'?'ias29':'ufrs';const Mo=kzModel(set,layer);if(Mo.loading){toast('Veriler yükleniyor, birazdan tekrar deneyin.','bad');return}
  const keep=S.hideZero;S.hideZero=true;const B=kzRows(Mo,'bs'),I=kzRows(Mo,'is');S.hideZero=keep;kzMemo(B,I,kzNci(set,Mo,B));
  const hdr=['Mali tablo kalemi',...Mo.cos.map(c=>c.name),'Toplam','Bilanço elim.','GT elim.','Konsolide'];
  const sh=(t,rows)=>{const a=[[set.name+' · '+t+' · '+periodLabel(S.period)+' · '+(layer==='ias29'?'IAS 29':'UFRS (endekssiz)')],['Tutarlar TL'],[],hdr];
    rows.forEach(r=>{if(r.t==='sec')a.push([r.label.toLocaleUpperCase('tr')]);else if(r.t==='memo'){const x=Array(hdr.length).fill('');x[0]=r.label;x[hdr.length-1]=r2(r.v);a.push(x)}else if(r.vals)a.push([r.label,...r.vals.map(v=>r2(v))])});return a};
  const el=[['Tür','Katman','Açıklama','IFRS kod','Mali tablo kalemi','Borç','Alacak']];
  Mo.ents.forEach(e=>(e.lines||[]).forEach(l=>{const mp=mapOf(l.line);el.push([e.kind==='pl'?'Gelir tablosu':'Bilanço',(e.layer||'both')==='both'?'UFRS + IAS 29':e.layer==='ias29'?'IAS 29':'UFRS',e.desc||'',l.line,mp?mp.line:'',+l.dr||0,+l.cr||0])}));
  const out=xlWrite([{name:'Konsolide bilanço',aoa:sh('Konsolide bilanço',B.rows)},{name:'Konsolide GT',aoa:sh('Konsolide gelir tablosu',I.rows)},{name:'Eliminasyonlar',aoa:el}]);
  const slug=norm(set.name).replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')||'konsolide';
  await saveFile(`${slug}_Konsolide_WTB_${layer==='ias29'?'IAS29':'UFRS'}_${S.period}.xlsx`,out,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}
document.addEventListener('click',async ev=>{
  const t=ev.target.closest('[data-act^="kz-"]');if(!t)return;const a=t.dataset.act,ds=t.dataset;
  switch(a){
    case 'kz-new':S.kzF={id:null,name:'Grup konsolide',sel:{},parent:'',pct:{}};S.kzE=null;render();window.scrollTo(0,0);break;
    case 'kz-cancel':S.kzF=null;render();break;
    case 'kz-save':kzSaveSet();break;
    case 'kz-tab':S.kzTab=ds.t;S.kzDel=null;if(ds.t!=='ayar')S.kzF=null;render();break;
    case 'kz-st':S.kzSt=ds.t;render();break;
    case 'kz-layer':S.kzLayer=ds.t;LS.set('kzLayer',ds.t);render();break;
    case 'kz-enew':S.kzE={id:null,kind:ds.k,layer:'both',desc:'',lines:[{line:'',dr:'',cr:''},{line:'',dr:'',cr:''}]};render();break;
    case 'kz-eedit':{const e=(S.kelim||[]).find(x=>x.id===ds.id);if(e)S.kzE={id:e.id,kind:e.kind,layer:e.layer||'both',desc:e.desc||'',createdAt:e.createdAt,lines:(e.lines||[]).map(l=>({line:l.line,dr:l.dr?NF2.format(l.dr):'',cr:l.cr?NF2.format(l.cr):''}))};render();window.scrollTo(0,0);break}
    case 'kz-ecancel':S.kzE=null;render();break;
    case 'kz-eadd':if(S.kzE){S.kzE.lines.push({line:'',dr:'',cr:''});render()}break;
    case 'kz-edl':if(S.kzE){S.kzE.lines.splice(+ds.i,1);render()}break;
    case 'kz-esave':kzSaveE();break;
    case 'kz-edel':if(S.kzDel!==ds.id){S.kzDel=ds.id;render();break}S.kzDel=null;try{await S.db.doc('kelim/'+ds.id).delete();toast('Eliminasyon silindi.')}catch(e){dbErr(e)}break;
    case 'kz-nodel':S.kzDel=null;render();break;
    case 'kz-sdel':{const set=kzSetCur();if(!set)break;if(S.kzDel!=='set:'+set.id){S.kzDel='set:'+set.id;render();break}S.kzDel=null;
      try{for(const e of (S.kelim||[]).filter(x=>x.setId===set.id))await S.db.doc('kelim/'+e.id).delete();await S.db.doc('kons/'+set.id).delete();S.kzSet=null;S.kzF=null;S.kzTab='wtb';toast('Konsolidasyon silindi.')}catch(e){dbErr(e)}break}
    case 'kz-copy':kzCopy();break;
    case 'kz-xls':kzExport();break;
  }
});
document.addEventListener('change',ev=>{
  const t=ev.target,id=t.id||'';if(!id.startsWith('kz-'))return;let m;
  if(id==='kz-set'){S.kzSet=t.value;LS.set('kzSet',t.value);S.kzF=null;S.kzE=null;S.kzDel=null;render();return}
  if(id==='kz-drafts'){S.drafts=t.checked;render();return}
  if(id==='kz-zero'){S.hideZero=t.checked;render();return}
  const f=S.kzF;
  if(f&&(m=id.match(/^kz-c-(.+)$/))){if(t.checked)f.sel[m[1]]=true;else{delete f.sel[m[1]];if(f.parent===m[1])f.parent=''}render();return}
  if(f&&id==='kz-parent'){f.parent=t.value;render();return}
  const E=S.kzE;
  if(E&&id==='kz-ekind'){E.kind=t.value;return}
  if(E&&id==='kz-elayer'){E.layer=t.value;return}
  if(E&&(m=id.match(/^kz-el(\d+)$/))){E.lines[+m[1]].line=t.value;kzFoot();return}
});
document.addEventListener('input',ev=>{
  const t=ev.target,id=t.id||'';if(!id.startsWith('kz-'))return;let m;
  const f=S.kzF;if(f&&id==='kz-name'){f.name=t.value;return}
  if(f&&(m=id.match(/^kz-p-(.+)$/))){f.pct[m[1]]=t.value;return}
  const E=S.kzE;if(!E)return;
  if(id==='kz-edesc'){E.desc=t.value;return}
  if((m=id.match(/^kz-e([dc])(\d+)$/))){E.lines[+m[2]][m[1]==='d'?'dr':'cr']=t.value;kzFoot();return}
});

/* ---------- Başlangıç ---------- */
async function use(n){try{return window.claude&&window.claude.use?await window.claude.use(n):null}catch(e){return null}}
(async function boot(){
  render();
  const seedEl=document.getElementById('fs-seed');let db,user,sample,dl;
  if(seedEl){let seed={};try{seed=JSON.parse(seedEl.textContent)}catch(e){}S.offline=seed;db=await makeLocalDB(seed);user=null;sample=null;dl=null;S.canEdit=true;S.canWrite=true}
  else [db,user,sample,dl]=await Promise.all([use('db'),use('user'),use('sample'),use('downloads')]);
  S.rawDb=db;S.db=db?guardDB(db):db;S.user=user;S.sample=sample;S.dl=dl;S.locks={};
  if(user){try{S.uid=await user.id()}catch(e){}}
  if(user){try{S.canEdit=!!(await user.canEdit())}catch(e){}try{const w=await user.can('data.write');S.canWrite=w===null?true:!!w}catch(e){}}
  if(S.canEdit)S.canWrite=true;
  if(!db){S.noDb=true;render();return}
  const fail=()=>{};
  db.doc('config/locks').onSnapshot(s=>{S.locks=(s.exists&&s.data()&&s.data().locks)||{};render()},()=>{});
  db.doc('config/main').onSnapshot(s=>{S.cfg=s.exists?normalizeCfg(s.data()):null;S.ready.cfg=true;render()},fail);
  db.collection('companies').onSnapshot(q=>{S.companies=q.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(a.order||0)-(b.order||0)||String(a.name).localeCompare(String(b.name),'tr'));S.ready.co=true;fixSel();render()},fail);
  db.collection('tb').onSnapshot(q=>{const idx={};q.docs.forEach(d=>{idx[d.id]=d.data()});S.tbIndex=idx;S.ready.tb=true;fixSel();render()},fail);
  db.collection('adj').onSnapshot(q=>{S.adj=q.docs.map(d=>Object.assign({id:d.id},d.data()));render()},fail);
  db.collection('map').onSnapshot(q=>{const m={};q.docs.forEach(d=>{m[d.id]=d.data()});S.maps=m;render()},fail);
})();
})();
</script>
